# Combined NetBird Server Configuration (Simplified)
# Generated by getting-started.sh

server:
  listenAddress: ":80"
  exposedAddress: "https://netbird.savorcare.com:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  authSecret: "__GENERATE_AT_DEPLOY__"
  dataDir: "/var/lib/netbird"

  auth:
    issuer: "https://netbird.savorcare.com/oauth2"
    signKeyRefreshEnabled: true
    sessionCookieEncryptionKey: "__GENERATE_AT_DEPLOY__"
    dashboardRedirectURIs:
      - "https://netbird.savorcare.com/nb-auth"
      - "https://netbird.savorcare.com/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  reverseProxy:
    trustedHTTPProxies:
      - "172.30.0.10/32"


  store:
    engine: "sqlite"
    encryptionKey: "__GENERATE_AT_DEPLOY__"
