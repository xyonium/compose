# 部署平台自定义层：与上游 docker-compose.upstream.yaml 合并使用
# 合并产物 docker-compose.yaml 由 main 分支的 sync-n8n.yml 工作流生成
#（bot 维护，勿手改）；要调整部署只改本文件。
#
# 自定义内容（2026-10-23 迁移入 compose 仓库，按安全原则：域名/registry 主机名
# 一律 env 模板化，仓库任何文件不得含真实域名/主机名，真实值由部署平台项目 env 注入）：
#   1. 镜像全部走私服 mirror（${JCR_REGISTRY} 的 docker hub 代理，
#      registry 主机名走项目 env）
#   2. n8n 摘掉宿主端口映射，改走 traefik（域名 ${N8N_DOMAIN} 走项目 env；
#      部署主机风格：websecure 入口固定泛域名证书文件，tls=true，无 certresolver）
#   3. postgres 冻结 16-alpine：线上数据卷是 pg16 初始化，上游已升到 18，
#      直接跟会起不来；pg 大版本升级是独立变更事件，届时手改本行
#   4. 固定项目名 n8n，数据卷名不随部署平台项目/stack 名变化

name: n8n

services:
  n8n:
    image: ${JCR_REGISTRY}/docker/n8nio/n8n:latest
    # 不暴露宿主端口（清掉上游的 5678:5678 映射），外部访问走 traefik
    ports: !reset null
    networks:
      # compose 合并语义：与上游默认网络合并为两者都挂
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      # 摘掉宿主端口后 traefik 无从猜测容器端口，显式钉死
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      # 域名模板化：真实域名由平台项目 env 注入 ${N8N_DOMAIN}
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      # 部署主机用固定证书文件（websecure 入口已配泛域名证书），不写 certresolver
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8nhttp.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8nhttp.entrypoints=web"
      # http2https 中间件在部署主机的 traefik 栈里已定义，直接引用
      - "traefik.http.routers.n8nhttp.middlewares=http2https"

  n8n-worker:
    image: ${JCR_REGISTRY}/docker/n8nio/n8n:latest

  n8n-runner:
    image: ${JCR_REGISTRY}/docker/n8nio/runners:latest

  n8n-worker-runner:
    image: ${JCR_REGISTRY}/docker/n8nio/runners:latest

  postgres:
    image: ${JCR_REGISTRY}/docker/postgres:16-alpine

  redis:
    image: ${JCR_REGISTRY}/docker/redis:7-alpine

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true
