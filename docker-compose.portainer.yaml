# 平台自定义层：与 docker-compose.upstream.yaml + docker-compose.upstream-proxy.yaml 合并使用
# 合并产物 docker-compose.yaml 由 main 分支的 sync-netbird.yml 工作流生成
#（bot 维护，勿手改）；要调整部署只改本文件。
#
# 自定义内容：
#   1. 镜像全部走私服 mirror（${JCR_REGISTRY} 的 docker hub 代理，registry 走项目 env）
#   2. 密钥外置：config.yaml → netbird_config 命名卷（灌注见 README）；
#      NB_PROXY_TOKEN / NB_RELAY_AUTH_SECRET → 平台项目 env（模板保留）
#   3. dashboard env 内联（无密钥）+ 开启 Agent Network 区块（非 ONLY 模式）
#   4. traefik 固定证书风格：上游渲染的 label 含真实域名——
#      为脱敏，4 组路由器 label（dashboard/http/grpc/backend）在这里按同 key
#      全覆盖为 ${NETBIRD_DOMAIN} 模板（compose label 合并按 key 后者胜），
#      另补 web 入口 http2https 跳转一条
#   5. proxy 私有模式：无 traefik 路由（agent 流量走 WG 隧道直连），
#      ACME 关闭，TLS 用泛域名证书目录（${NETBIRD_CERT_DIR} 挂载，certwatch 热加载）
#
# 平台项目 env 必填 5 个：NETBIRD_DOMAIN / JCR_REGISTRY / NETBIRD_CERT_DIR
#   / NB_PROXY_TOKEN / NB_RELAY_AUTH_SECRET（合并产物 --no-interpolate，模板原样保留）

name: netbird

services:
  dashboard:
    image: ${JCR_REGISTRY}/docker/netbirdio/dashboard:latest
    env_file: !reset null
    environment:
      NETBIRD_MGMT_API_ENDPOINT: https://${NETBIRD_DOMAIN}
      NETBIRD_MGMT_GRPC_API_ENDPOINT: https://${NETBIRD_DOMAIN}
      AUTH_AUDIENCE: netbird-dashboard
      AUTH_CLIENT_ID: netbird-dashboard
      AUTH_CLIENT_SECRET: ""
      AUTH_AUTHORITY: https://${NETBIRD_DOMAIN}/oauth2
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: openid profile email groups
      AUTH_REDIRECT_URI: /nb-auth
      AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
      NGINX_SSL_PORT: "443"
      LETSENCRYPT_DOMAIN: none
      NETBIRD_AGENT_NETWORK_ENABLED: "true"
      # 浏览器 RDP/SSH（Dashboard 上的 RDP 按钮）走 Browser Client：浏览器里跑一个
      # WASM peer，数据面只走 relay 的 WebSocket（无 P2P）。dashboard 的 CSP 只会自动
      # 把 auth 与 management 主机加进 connect-src，且 MGMT 那条会削掉端口；relay 在
      # 独立子域 + 9443，不在策略里 → 浏览器静默拒绝拨号，表现就是“一直连不上”，
      # 服务端一条连接日志都没有。此处按 relay 实际地址放行（relay 地址变了要同步改）。
      NETBIRD_CSP: wss://relay.${NETBIRD_DOMAIN}:9443
      # 浏览器客户端 wasm 版本：dashboard v2.95.0 默认拉 v0.76.3，与 server 0.81.3 /
      # peer 0.81.4 差 5 个小版本。症状：RDP 在 CredSSP(NLA) 阶段客户端冻住 90 秒
      # （wg 握手日志的时间戳被整体推迟 90 秒 = Go/WASM 事件循环被阻塞），随后被服务端
      # RST，且 Windows 侧完全没有 4625 记录。对齐到与 server 同代的 v0.81.4。
      # ⚠️ 若出现 dashboard 的 RDP 页面异常（JS 桥与 wasm 不匹配），删掉本行即回落 0.76.3。
      NETBIRD_WASM_PATH: https://pkgs.netbird.io/wasm/client/v0.81.4
    labels:
      # 上游渲染的 router label 含真实域名——按同 key 全覆盖为 ${NETBIRD_DOMAIN}
      # 模板（compose label 合并按 key 后者胜），同时补 web 入口跳转
      - "traefik.http.routers.netbird-dashboard.rule=Host(`${NETBIRD_DOMAIN}`)"
      - "traefik.http.routers.netbird-dashboard.entrypoints=websecure"
      - "traefik.http.routers.netbird-dashboard.tls=true"
      - "traefik.http.routers.netbird-http.rule=Host(`${NETBIRD_DOMAIN}`)"
      - "traefik.http.routers.netbird-http.entrypoints=web"
      - "traefik.http.routers.netbird-http.middlewares=http2https"

  netbird-server:
    image: ${JCR_REGISTRY}/docker/netbirdio/netbird-server:latest
    # STUN 移到 relay 容器（config.yaml 里配了外部 stuns/relays 后内嵌 STUN/relay 自动关闭）
    ports: !reset null
    # !override 整体替换上游 volumes：./config.yaml bind → netbird_config 命名卷
    volumes: !override
      - netbird_data:/var/lib/netbird
      - netbird_config:/etc/netbird
    labels:
      # 同 key 全覆盖上游两组 router rule：域名模板化（${NETBIRD_DOMAIN}），
      # grpc rule 同时补上 option-1 渲染漏掉的 ProxyService 路径（同栈内网直连用不到，
      # 仅将来远程 proxy 需要）。上游若改 rule 其余部分，此处需跟随（哨兵有 ProxyService 针）。
      - "traefik.http.routers.netbird-grpc.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))"
      - "traefik.http.routers.netbird-backend.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))"

  # 外部 relay + STUN（官方 scaling 指南形态）：经边界防火墙端口映射对外，
  # 不占 443/80；TLS 用宿主同步的泛域名证书（${NETBIRD_CERT_DIR}：
  # 证书只在启动时读一次，每次续期后要 docker restart 该容器）
  relay:
    image: ${JCR_REGISTRY}/docker/netbirdio/relay:latest
    container_name: netbird-relay
    restart: unless-stopped
    ports:
      - '9443:9443/tcp'   # relay WebSocket（边界映射 9443/tcp → 部署主机）
      - '9443:9443/udp'   # relay QUIC（同端口 UDP，Docker 不会自动带，必须显式）
      - '3479:3479/udp'   # 内嵌 STUN（刻意避开默认 3478，本例被边界设备的 TURN 占用）
    environment:
      NB_LOG_LEVEL: info
      NB_LISTEN_ADDRESS: :9443
      NB_EXPOSED_ADDRESS: rels://relay.${NETBIRD_DOMAIN}:9443
      # 与 config.yaml 里 relays.secret 同一值（平台项目 env 注入）
      NB_AUTH_SECRET: ${NB_RELAY_AUTH_SECRET}
      NB_TLS_CERT_FILE: /certs/fullchain.pem
      NB_TLS_KEY_FILE: /certs/key.pem
      NB_ENABLE_STUN: "true"
      NB_STUN_PORTS: "3479"
    volumes:
      # 证书 bind 用长语法——短语法 ${VAR}:/path 会被 compose 归一化成 named volume
      # （docker compose 对插值 shorthand 的类型猜测缺陷，sync 实跑后才暴露）
      - type: bind
        source: /${NETBIRD_CERT_DIR}
        target: /certs
        read_only: true
      - relay_data:/data

  proxy:
    image: ${JCR_REGISTRY}/docker/netbirdio/reverse-proxy:latest
    env_file: !reset null
    environment:
      NB_PROXY_DEBUG_LOGS: "false"
      NB_PROXY_MANAGEMENT_ADDRESS: http://netbird-server:80
      NB_PROXY_ALLOW_INSECURE: "true"
      NB_PROXY_DOMAIN: ${NETBIRD_DOMAIN}
      NB_PROXY_ADDRESS: :8443
      NB_PROXY_TOKEN: ${NB_PROXY_TOKEN}
      NB_PROXY_ACME_CERTIFICATES: "false"
      NB_PROXY_FORWARDED_PROTO: https
      NB_PROXY_PROXY_PROTOCOL: "false"
      NB_PROXY_PRIVATE: "true"
      # 固定 WG 端口配合宿主 UDP 映射（单账号部署适用）；
      # 51820 被边界防火墙自带 netbird 客户端占用，故用 51821
      NB_PROXY_WG_PORT: "51821"
      # 主证书直接用宿主同步的泛域名证书（含 *.${endpoint 域名空间}），
      # certwatch 盯文件热更新，续期无需介入；静态证书同时覆盖 endpoint SNI
      NB_PROXY_CERTIFICATE_DIRECTORY: /wildcard-certs
      NB_PROXY_CERTIFICATE_FILE: fullchain.pem
      NB_PROXY_CERTIFICATE_KEY_FILE: key.pem
    # !override 替换上游端口映射：WG 端口 51821（与上面 env 一致）
    ports: !override
      - '51821:51821/udp'
    # !override 整体替换上游 labels：私有模式不暴露任何 traefik 路由
    labels: !override
      - "traefik.enable=false"
    # !override 重定向网络：与 server 同网，管理面内网直连
    networks: !override
      - reverse-proxy
    volumes:
      - netbird_proxy_certs:/certs
      - type: bind
        source: /${NETBIRD_CERT_DIR}
        target: /wildcard-certs
        read_only: true

volumes:
  netbird_config:
  relay_data:
