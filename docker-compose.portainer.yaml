# 部署自定义层（compose 仓库 firecrawl 分支）：唯一手改文件。main 上的
# sync-firecrawl bot 把它与 docker-compose.upstream.yaml 合并、钉 digest
# 后生成 docker-compose.yaml，部署平台（Arcane）只消费生成品。请勿手动
# 合并两文件部署——本文件里 api/mcp 等上游镜像不带 digest，会覆盖掉生成品里的钉版。
services:
  playwright-service:
    image: ${JCR_REGISTRY:-ghcr.io}${JCR_REGISTRY:+/ghcr}/firecrawl/playwright-service:latest
    build: !reset null
    # tini 做 PID 1：回收 Chromium 崩溃后被过继的孤儿 renderer 僵尸进程。
    init: true
    restart: unless-stopped
    ports:
      - "3031:3000"
    # 浏览器级假死自愈（2026-11-08）。本服务把 Chromium 句柄存成模块级全局，
    # initializeBrowser() 只在 !browser 时调用，且没有 browser.on("disconnected")
    # 或把 browser 置回 undefined 的路径 —— 一旦 Chromium 主进程消失（OOM 或内部崩溃），
    # 句柄永远 stale，之后每次 newContext 都抛 TargetClosedError：/health 503、
    # /scrape 500，而 Node 进程还活着 → 容器不退出、restart 策略不触发，永久降级。
    # 实测：页面超时 / 并发 10 个重页面 / 杀掉 renderer 都能自行恢复，只有整只浏览器
    # 消失才会卡死，所以这里只针对该状态下手。
    # 容器内没有 curl/pkill/ps，只有 node → 用 node 的 fetch 探上游自带的 /health
    # （真 readiness：会新建 context+page 再关掉）；
    # 杀的是 `node dist/api.js` 子进程（PID 1 是 pnpm，不受 PID-1 免疫影响，子进程
    # 一死 pnpm 退出、容器由 restart 策略拉起 —— 已实测）。
    # 防误杀/防漏杀（2026-11-08 二轮评审整改）：
    # - 单次检查只探 1 次（旧版在同一个检查里隔 3s 连探两次就动手，架空了 retries，
    #   负载抖动时容易误杀在途请求）。
    # - 计数靠状态文件 + `/proc/1/stat` 的启动戳绑定：容器重启后 starttime 必变，
    #   旧状态自动失效，因此不必改 command 去清 marker。
    # - 冷启动绝对安全：`ok` 未置位前（本容器从未成功过）任何失败都只 exit 1。
    # - 超时/挂死也纳入自愈：连续 3 个周期失败（无论 503 还是 8s 超时）即动手。
    # - 额外判 pageSemaphore 泄漏：/health 不走信号量，若 activePages 连续 6 个周期
    #   顶满 maxConcurrentPages（上游 /scrape 的 finally 里 page.close() 抛错会跳过
    #   release），说明抓取通道已死而 /health 仍 200，此时同样自愈。
    # - 自愈原因写 /proc/1/fd/2 → 直接进 docker logs（实测），不再只存在
    #   .State.Health.Log 那个只留 5 条的环形缓冲里。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'const fs=require("fs"),S="/tmp/pw-hc.json",U="http://127.0.0.1:3000/health";const log=(m)=>{const l="[SELF-HEAL] "+new Date().toISOString()+" "+m+"\n";try{process.stderr.write(l)}catch(e){}try{fs.appendFileSync("/proc/1/fd/2",l)}catch(e){}};const s0=fs.readFileSync("/proc/1/stat","utf8");const rest=s0.slice(s0.lastIndexOf(String.fromCharCode(41))+2).split(" ");const boot=rest[19]||"0";let st={b:boot,ok:0,f:0,sat:0};try{const d=JSON.parse(fs.readFileSync(S,"utf8"));if(d.b===boot)st=d}catch(e){}const save=()=>{try{fs.writeFileSync(S,JSON.stringify(st))}catch(e){}};(async()=>{let ok=false,sat=false,why="";try{const r=await fetch(U,{signal:AbortSignal.timeout(8000)});let j={};try{j=await r.json()}catch(e){}if(r.ok){ok=true;sat=(typeof j.activePages==="number"&&typeof j.maxConcurrentPages==="number"&&j.maxConcurrentPages>0&&j.activePages>=j.maxConcurrentPages)}else{why="http "+r.status+" "+(j.error||"")}}catch(e){why="probe error: "+String(e&&e.message||e)}if(ok){st.ok=1;st.f=0;st.sat=sat?((st.sat||0)+1):0;save();if(st.sat<6)process.exit(0);why="pageSemaphore stuck at max for "+st.sat+" checks"}else{st.f=(st.f||0)+1;save();if(!st.ok||st.f<3)process.exit(1);why=why+" (fails="+st.f+")"}let k=0;for(const p of fs.readdirSync("/proc")){const n=+p;if(!Number.isInteger(n)||n===1||n===process.pid)continue;try{const a=fs.readFileSync("/proc/"+p+"/cmdline","utf8").split(String.fromCharCode(0)).filter(Boolean);if(a.length>=2&&a[0].endsWith("node")&&a.some(function(x){return x==="dist/api.js"||x.endsWith("/dist/api.js")})){log("playwright self-heal: "+why+"; killing api.js pid "+n);process.kill(n,"SIGKILL");k++}}catch(e){}}if(!k)log("playwright self-heal wanted ("+why+") but no dist/api.js process found");process.exit(1)})()'
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 60s
      start_interval: 5s
  api:
    image: ${JCR_REGISTRY:-ghcr.io}${JCR_REGISTRY:+/ghcr}/firecrawl/firecrawl
    build: !reset null
    restart: unless-stopped
    init: true
    container_name: firecrawl
    networks:
      - reverse-proxy
    environment:
      # research/developer 端点 + research 工具的上游（本栈 research-proxy 服务）。
      # 设上后 api 才会挂载 /v2/search/research/* 与 /v2/search/developer 路由。
      RESEARCH_PROXY_URL: "http://research-proxy:3100"
      # 两阶段 parse 上传（/v2/parse/upload-url → PUT → /v2/parse?uploadRef=）的
      # ref 签名密钥。本栈 ENV=local，上传走内存 driver，无需 GCS。
      # 值在部署平台的 stack env 里配，不进 git。
      PARSE_UPLOAD_REF_SECRET: ${PARSE_UPLOAD_REF_SECRET:-}
      # PDF 走容器内原生 Rust 提取（firecrawl-rs 已在镜像内），复杂排版质量优于
      # pdf-parse 兜底；扫描件 fast 模式会明确报 OCR-required。
      PDF_RUST_EXTRACT_ENABLE: ${PDF_RUST_EXTRACT_ENABLE:-true}
      # libuv 线程池扩容：USE_GO_MARKDOWN_PARSER 的 koffi .async 走 uv_queue_work，
      # 默认 4 线程在并发 4 个大页转换时会被占满，连带把 dns.lookup / fs 一起饿死，
      # 反过来把探针拖超时造成误杀。
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
      # HTML→Markdown 走镜像内置的 Go 解析器（koffi 的 .async，跑在 libuv 线程池，
      # 不占 Node 主事件循环）。上游无默认值、SELF_HOST 文档也未提及，不设就只有
      # 纯 JS Turndown 兜底：3 MB 级大表页在主线程同步转换实测 100% CPU 长时间
      # 不返回（2026-11-07 线上 api 假死复现），整个 :3002 连 /v2/search 一起挂死。
      # 实测同一段 3 MB HTML：Go 解析器 1.9 s 且事件循环全程可调度；Turndown >4 min
      # 仍卡在 R 状态。缺 .so 时仍会自动回落 Turndown，不会更糟。
      USE_GO_MARKDOWN_PARSER: ${USE_GO_MARKDOWN_PARSER:-true}
      # 扫描件 OCR 走本栈 pdf-ocr 适配器（契约=RunPod MU，后端=自托管 MinerU）。
      # 这两个值只需非空，Bearer 被适配器忽略；URL 由下面的启动 sed 改写。
      RUNPOD_MU_API_KEY: ${RUNPOD_MU_API_KEY:-local}
      RUNPOD_MU_POD_ID: ${RUNPOD_MU_POD_ID:-local}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.firecrawl.rule=Host(`${FIRECRAWL_DOMAIN}`)"
      - "traefik.http.routers.firecrawl.entrypoints=websecure"
      - "traefik.http.routers.firecrawl.tls=true"
      - "traefik.http.routers.firecrawlhttp.rule=Host(`${FIRECRAWL_DOMAIN}`)"
      - "traefik.http.routers.firecrawlhttp.entrypoints=web"
      - "traefik.http.routers.firecrawlhttp.middlewares=http2https"
      - "traefik.docker.network=reverse-proxy"
    command: >
      sh -c "
      rm -f /tmp/api-hc-ok /tmp/api-hc-fail
      && sed -i 's/getModelLimits(\"gpt-4o-mini\")/getModelLimits(\"gemini-2.5-flash-lite\")/g' /app/dist/src/scraper/scrapeURL/transformers/llmExtract.js
      && echo '✅ Patched: getModelLimits now uses gemini-2.5-flash-lite (1M input, 65K output)'
      && sed -i 's#https://api\.runpod\.ai/v2/#http://pdf-ocr:3200/runpod/v2/#g' /app/dist/src/scraper/scrapeURL/engines/pdf/runpodMU.js
      && echo '✅ Patched: RunPod MU base URL -> pdf-ocr adapter (self-hosted MinerU)'
      && node dist/src/harness.js --start-docker
      "
    # api 假死自愈（2026-11-07 事故）。api 主线程被同步转换锁死后进程并不退出，
    # 于是 harness 的 exit 监听和 restart: unless-stopped 全都不触发——容器一直
    # "Up" 而 :3002 从 TCP 握手到首字节永远没回应，只有人工重启才能恢复。
    # 这里探上游自带的只读心跳（/v0/health/readiness，实测 2-3 ms，纯 liveness，
    # 不查依赖），连续 4 次失败「且本容器此前健康过」就 SIGTERM harness、2 秒后
    # `pkill -KILL -f '^node dist/src/'` 杀整棵 node 树 —— 只杀 index.js 不够：
    # 上游 harness 在生产模式（IS_DEV=false）terminateProcess 只发 SIGTERM、没有
    # SIGKILL 兜底，任一 worker 不响应就会永远退不出容器（实测进程树是
    # harness + index + 9 个 worker）。node 树全死 → 容器退出 → restart 策略拉起全套。
    # marker 文件在 command 开头清掉，所以冷启动（从未 healthy 过）绝不会误杀；
    # start_period 给足冷启动窗口，start_interval 让重启后几秒就判回 healthy
    # （traefik 会把非 healthy 容器摘流，这段越短越好）。
    # 注意 $$ 是 compose 部署期插值的转义，部署后容器看到的是单个 $。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -m 8 http://127.0.0.1:3002/v0/health/readiness >/dev/null 2>&1
          && { touch /tmp/api-hc-ok 2>/dev/null || true; rm -f /tmp/api-hc-fail 2>/dev/null || true; exit 0; };
          n=$$(cat /tmp/api-hc-fail 2>/dev/null);
          n=$$(( $${n:-0} + 1 ));
          echo "$$n" > /tmp/api-hc-fail 2>/dev/null || n=4;
          if [ -f /tmp/api-hc-ok ] && [ "$$n" -ge 4 ]; then
            m="[SELF-HEAL] $$(date -Iseconds) api unresponsive for $$n checks; killing node dist/src tree";
            echo "$$m" >&2;
            echo "$$m" >> /proc/1/fd/2 2>/dev/null || true;
            pkill -TERM -f '^node dist/src/harness\.js' 2>/dev/null || true;
            sleep 2;
            pkill -KILL -f '^node dist/src/' 2>/dev/null || true;
          fi;
          exit 1
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s
      start_interval: 5s
  redis:
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/redis:alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/rabbitmq:3-management
    restart: unless-stopped
    # 放宽上游健康检查窗口：全栈同时重建时 RabbitMQ 冷启动实测 ~27s，而上游默认
    # start_period 5s + retries 3×5s ≈ 20s 就被判 unhealthy，compose 随即中止启动，
    # api 永远停在 created（2026-09-28 命中）。start_period 只豁免早期失败，
    # 不影响首次成功即转 healthy 的速度。
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - /tmp/firecrawl/rabiitmq:/var/lib/rabbitmq

  nuq-postgres:
    image: ${JCR_REGISTRY:-ghcr.io}${JCR_REGISTRY:+/ghcr}/firecrawl/nuq-postgres:latest
    build: !reset null
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data

  foundationdb:
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/foundationdb/foundationdb:7.3.63

  foundationdb-init:
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/foundationdb/foundationdb:7.3.63

  # PDF OCR 适配器（源码在本分支 pdf-ocr/，详见其 README）。实现 RunPod MU
  # serverless 契约并转发到自托管 MinerU，让扫描件/图片型 PDF 走自己的 GPU。
  # api 启动时 sed 把 dist 里硬编码的 api.runpod.ai 改指到本服务；失败一律
  # 502，api 会降级回容器内 pdf-parse。镜像由 pdf-ocr-image workflow 云端构建钉版。
  pdf-ocr:
    image: ${JCR_REGISTRY:-ghcr.io}${JCR_REGISTRY:+/ghcr}/xyonium/firecrawl-pdf-ocr@sha256:f29ebd525ce65fe27427ab9e355609fe541985044f810a4df8908e5dd885f9c6
    container_name: firecrawl-pdf-ocr
    restart: unless-stopped
    environment:
      # MinerU 地址无默认（默认即泄漏内网主机名）：项目 env **必填**
      MINERU_BASE_URL: ${MINERU_BASE_URL}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
    networks:
      - backend

  # research 上游 shim（源码在本分支 research-proxy/，详见其 README）。
  # 桥接 papers-service（/papers/* 上游）+ reach-mcp（/reach/read_url，仍在 mcpo）
  # + GitHub API，实现 cloud-only 的 research papers / similar / read / code search
  # 端点。纯内部服务，不过 traefik。
  # 镜像由 .github/workflows/research-proxy-image.yml 构建推 ghcr 并钉 digest 回本文件；
  # 改代码推本分支即自动出图更新（CE 靠 compose diff 拉新镜像，无需本地 build）。
  # mcpo 容器（reach-mcp 网关）经 reverse-proxy 网络以名字 mcpo 访问。
  research-proxy:
    image: ${JCR_REGISTRY:-ghcr.io}${JCR_REGISTRY:+/ghcr}/xyonium/firecrawl-research-proxy@sha256:9d79159b1e5dc94b4213ea4cf5d4c00626d20284dcd15baaf90a9a46b11ee767
    container_name: firecrawl-research-proxy
    restart: unless-stopped
    environment:
      MCPO_BASE_URL: ${MCPO_BASE_URL:-http://mcpo:8000}
      # /papers/* 上游（默认指向本栈 papers-service，paper-search-mcp 已退役）；
      # /reach/read_url 仍走 mcpo 的 reach-mcp。两者缺省回落 MCPO_BASE_URL。
      PAPERS_BASE_URL: ${PAPERS_BASE_URL:-http://papers-service:3200}
      REACH_BASE_URL: ${REACH_BASE_URL:-http://mcpo:8000}
      PAPER_SOURCES: ${PAPER_SOURCES:-arxiv,semantic,pubmed,openalex,crossref,europepmc,dblp,hal,pmc}
      # 以下密钥在部署平台的 stack env 里配，不进 git：
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      GITHUB_TOKENS: ${GITHUB_TOKENS:-}
    networks:
      - backend
      - reverse-proxy

  # paper-search-mcp 的替代（源码在本分支 papers-service/，详见其 README）：
  # 为 research-proxy 提供 /papers/* 上游——检索直连公开学术 API（镜像构建时打进
  # paper-search 仓库 tool.py 的全部直连适配器，含 scholar 三级链），read 是轻量
  # 直连实现，读不了的源 404 由 research-proxy 落 reach-mcp。纯内部服务，不过 traefik。
  # 镜像由 .github/workflows/papers-service-image.yml 构建推 ghcr 并钉 digest 回本文件；
  # tool.py 升级后手动 workflow_dispatch 一把即出新镜像。
  papers-service:
    image: ${JCR_REGISTRY:-ghcr.io}${JCR_REGISTRY:+/ghcr}/xyonium/firecrawl-papers-service@sha256:5a056d9d145f956fd5b080ea1647abe7a2cb5a97d25462e9a45e6140acf2fd48
    container_name: firecrawl-papers-service
    restart: unless-stopped
    environment:
      # 密钥在部署平台的 stack env 里配，不进 git（与 OWUI tool 同名语义）：
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      CORE_API_KEY: ${CORE_API_KEY:-}
      IEEE_APIKEY: ${IEEE_APIKEY:-}
      ZENODO_ACCESS_TOKEN: ${ZENODO_ACCESS_TOKEN:-}
      ZHIHUIYA_APIKEY: ${ZHIHUIYA_APIKEY:-}
      # scholar 链 + dblp Anubis 兜底用的 firecrawl 仍走 mcpo（其 firecrawl 服务
      # 指向 api-key-rotator → 官方云）；tavily/apify 走 rotator（在 owui 网络上）：
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-http://mcpo:8000/firecrawl}
      TAVILY_BASE_URL: ${TAVILY_BASE_URL:-http://api-key-rotator:8788/tavily}
      APIFY_ROTATOR_BASE_URL: ${APIFY_ROTATOR_BASE_URL:-http://api-key-rotator:8788/apify}
      MCPO_API_KEY: ${MCPO_API_KEY:-}
      # download_with_fallback 的 Unpaywall 请求标识（匿名有配额限制）
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
    networks:
      - backend
      - reverse-proxy
      - owui  # api-key-rotator 所在网络（scholar 链 tier2/3 与 OWUI tool 同路）

  # MCP server（原 stack 270 迁入）。与 api 同栈后走内部网络直连，不再绕公网。
  # 服务名与容器名统一为 firecrawl-mcp，避免裸名 mcp 与 mcpo 容器在共享网络上撞名。
  # traefik 规则保持旧路径不变：/v2/mcp 是新版原生端点；/mcp 由
  # 3.33.4 起上游 mcp 只服务 /mcp（/v2/mcp 返回 404，已实测）——中间件反向：
  # 把旧客户端的 /v2/mcp 重写到 /mcp；/mcp、/sse、/messages 原生直通。
  # （3.23 时代曾正向重写 /mcp→/v2/mcp，上游路径策略翻转后必须跟着翻。）
  # 标签里的 $$ 是给 compose 部署期插值的转义，部署后 traefik 看到的是 $1。
  firecrawl-mcp:
    image: ${JCR_REGISTRY:-ghcr.io}${JCR_REGISTRY:+/ghcr}/firecrawl/firecrawl-mcp-server:latest
    # PID 1 交给 tini：容器内 PID 1 对 SIGKILL/SIGSTOP 免疫（内核 SIGNAL_UNKILLABLE），
    # 而本服务的命令末尾是 `exec node ...`，不加 init 时 node 恰好就是 PID 1 ——
    # 自愈脚本的 kill 会变成静默空操作。init 后 node 变成子进程，可被杀；
    # 顺带由 tini 回收僵尸子进程（实测该容器会残留 [node]/[pkill] 僵尸）。
    init: true
    container_name: firecrawl-mcp
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      # 3.33.4 起上游镜像以 node(uid=1000) 运行且 /app/dist 属 root 不可写
      # —— 先拷到 /app 内可写副本，patch 副本，再 exec 副本。用 /tmp/app-root
      # 而不是 /app 内位置是因为 dist/index.js 有 require("../package.json")
      # （模块 scope 判定），拷到 /app/dist-patched 会沿父目录读到 app/package.json，
      # 而 /app 本身已带 package.json 会被误判为 pristine 副本。cp 整个 /app
      # 到 /tmp/app-root 保证 package.json 跟随 dist 一起被解析。
      # node_modules 本身属 root 无执行权限问题，直接用 /app/node_modules。
      # 重启时 rm 重拷，保证 patch 总在 pristine 底子上跑、幂等不误伤。
      - |
        rm -f /tmp/mcp-hc-ok /tmp/mcp-hc-fail && rm -rf /tmp/app-root && cp -r /app /tmp/app-root && node -e '
        const fs = require("fs"), path = require("path");
        function walk(d) {
          let r = [];
          for (const e of fs.readdirSync(d, {withFileTypes: true})) {
            const f = path.join(d, e.name);
            if (e.isDirectory()) r = r.concat(walk(f));
            else if (e.name.endsWith(".js")) r.push(f);
          }
          return r;
        }

        const backtick = "\x60";

        const bang = "**SearXNG !bang:** prefix the query to pick a source category: !science (papers/academic), !it (programming), !general (default web), !news, !images. For academic or research queries ALWAYS prefix with !science instead of adding keywords like \"research paper\" to the query. Example: \"!science continuous glucose monitoring sensor accuracy\".";

        const cleanDesc = "LLM-based cleaning pass that removes residual boilerplate (cookie banners, ads, social widgets, breadcrumbs, comments) that onlyMainContent misses. Preserves headings, lists, tables, code blocks, links. Can combine with onlyMainContent. Auto-skipped (preserving original) if content exceeds model token limit. Recommended to enable for complex structured websites when speed is not critical. If the returned content is unexpectedly short or seems to be missing key content, try disabling this option and re-scraping.";

        let n = 0;
        for (const f of walk("/tmp/app-root/dist")) {
          let c = fs.readFileSync(f, "utf8");
          let modified = false;
          let logs = [];

          // 1. Insert !bang guidance into the search description, right after the
          //    operators sentence. Upstream removed the old "**Sources:**" anchor
          //    (v3.24-ish), so anchor on "the set is non-exhaustive." instead;
          //    idempotency guard checks the inserted marker itself.
          //    Escape via JSON.stringify minus the wrapping quotes: since the
          //    2026-09-28 image the first anchor occurrence sits inside a
          //    double-quoted .describe("...") in the bundle, so a raw " would
          //    terminate the string and break the whole file (crash loop).
          //    \" is harmless in template-literal / single-quoted contexts too.
          if (!c.includes("**SearXNG !bang:**") && c.includes("the set is non-exhaustive.")) {
            const bangEsc = JSON.stringify(bang).slice(1, -1);
            c = c.replace("the set is non-exhaustive.", "the set is non-exhaustive. " + bangEsc);
            modified = true; logs.push("!bang");
          }

          // 2. Add onlyCleanContent to schema after onlyMainContent
          if (!c.includes("onlyCleanContent")) {
            const nc = c.replace(
              /(onlyMainContent:\s*)(\w+)\.boolean\(\)\.optional\(\)/g,
              (m, p, v) => p + v + ".boolean().optional(),onlyCleanContent: " + v + ".boolean().optional().describe(\"" + cleanDesc + "\")"
            );
            if (nc !== c) { c = nc; modified = true; logs.push("onlyCleanContent"); }
          }

          // 3. (removed 2026-10-21) example-clean: upstream dropped the
          //    "onlyMainContent": true example literals in 3.23.0; verified a
          //    silent no-op across npm 3.23.0-3.33.4 and on the pinned deploy
          //    digest. Tombstone kept to preserve patch numbering.

          // 4. Strip the remaining feedback pointer from the search
          //    description. The prose trio ("**After the search:**" etc.)
          //    disappeared upstream in 3.23.0, but the rewrite left one tail
          //    line pointing at a tool this stack disables via
          //    FIRECRAWL_NO_SEARCH_FEEDBACK -- a guaranteed-dead pointer.
          //    Old digest: line absent, no-op by design (A/B verified).
          if (c.includes("for optional search feedback")) {
            const nc = c.replace(
              " Authenticated responses can include an \\`id\\` for optional search feedback.",
              ""
            );
            if (nc !== c) { c = nc; modified = true; logs.push("feedback-pointer-strip"); }
          }

          // 5. categories enum 保留全部四项：github/research/pdf 是 SearXNG 查询改写
          //    （自托管可用），developer 由本栈 research-proxy 服务兜底。
          //    research 工具同理（registerResearchTools 不再禁用）——均由
          //    RESEARCH_PROXY_URL -> research-proxy 提供。

          // 6. Disable monitor tools (cloud-only)
          if (c.includes("registerMonitorTools") && !c.includes("monitor-disabled")) {
            const before = c;
            c = c.replace(/registerMonitorTools\s*\([^)]*\)\s*;/g, "/* monitor-disabled */");
            if (c !== before) { modified = true; logs.push("monitor-disable"); }
          }

          // 7. Disable agent + interact tools (cloud-only)
          {
            const before = c;
            c = c.replace(
              /server\.addTool\((\s*\{\s*name:\s*[\x22\x27]firecrawl_(?:agent|agent_status|interact|interact_stop)[\x22\x27])/g,
              "(() => {})($1"
            );
            if (c !== before) { modified = true; logs.push("agent-interact-disable"); }
          }

          // 8. (removed 2026-10-21) agent-refs: the four scrape/map prose
          //    lines this strip targeted were removed upstream in 3.23.0;
          //    silent no-op since (verified on the pinned deploy digest).
          //    Agent/interact registration stays disabled via #7. Tombstone
          //    kept to preserve patch numbering.

          // 9. parse tool: this MCP is a remote deployment — filePath is resolved
          //    on the MCP container filesystem, so client-local paths always
          //    ENOENT. Upstream now explains local-vs-hosted generically; what it
          //    lacks is that THIS deployment is remote plus the concrete endpoint.
          //    Keep the note short; no backticks or dollar-brace (would break
          //    the template literal / compose interpolation), no apostrophes
          //    (would break the single-quoted node -e).
          if (!c.includes("REMOTE PARSE NOTE") && c.includes("Parse one supported document into markdown")) {
            c = c.replace(
              "Parse one supported document into markdown",
              "REMOTE PARSE NOTE: this MCP server is a remote deployment; filePath is resolved on the server filesystem and caller-local paths fail with ENOENT. To parse a caller-local file, POST it as multipart/form-data to https://" + (process.env.FIRECRAWL_DOMAIN || "firecrawl.example.com") + "/v2/parse (field file, plus an optional options JSON string). Parse one supported document into markdown"
            );
            modified = true; logs.push("parse-remote-note");
          }

          // 10. Disable credit_usage tool (cloud-only): self-hosted api has no
          //     Autumn billing backend (AUTUMN_SECRET_KEY missing -> 500). The
          //     tool registration call site is unique; commenting it out drops
          //     the tool plus its creditUsageOutputSchema cleanly. Upstream has
          //     no env switch for this (checked all FIRECRAWL_* env reads).
          if (c.includes("registerUsageTools(server, getClient);")) {
            c = c.replace(
              "registerUsageTools(server, getClient);",
              "/* usage-tools-disabled: no Autumn billing backend in self-host */"
            );
            modified = true; logs.push("usage-tools-disable");
          }

          // 11. Fill the empty .describe() slots on research tool params
          //     (upstream shipped them blank; the tool descriptions carry most
          //     of the semantics, so keep these to what a caller cannot infer
          //     from the name — no apostrophes here, see patch 9 note).
          //     Anchors are the unique zod param blocks; (\w+) capture makes
          //     the patch alias-agnostic so tsup z-aliasing (z6, z7, z9, z12)
          //     does not silently drift (root cause of 2026-10-21 dry-run
          //     pinned latest sync revert; upstream alias had moved z6 to z9).
          {
            const before = c;
            c = c.replace(
              /seed_ids: (\w+)\.array\(\1\.string\(\)\)\.min\(1\)\.max\(10\)(?!\.describe)/,
              "seed_ids: $1.array($1.string()).min(1).max(10).describe(\"1-10 paper IDs; the first is the seed, the rest are anchors.\")"
            );
            c = c.replace(
              /intent: (\w+)\.string\(\)\.min\(1\)(?!\.describe)/,
              "intent: $1.string().min(1).describe(\"What the related papers should be about; used to rank candidates.\")"
            );
            c = c.replace(
              /mode: (\w+)\.enum\(\[\"similar\", \"citers\", \"references\"\]\)\.optional\(\)(?!\.describe)/,
              "mode: $1.enum([\"similar\", \"citers\", \"references\"]).optional().describe(\"similar (default): co-citation/bibliographic coupling; citers: papers citing the seed; references: papers the seed cites.\")"
            );
            c = c.replace(
              /k: (\w+)\.number\(\)\.int\(\)\.min\(1\)\.max\(500\)\.optional\(\)(?!\.describe)/g,
              "k: $1.number().int().min(1).max(500).optional().describe(\"Number of ranked papers to return (default 10).\")"
            );
            c = c.replace(
              /question: (\w+)\.string\(\)\.min\(1\)(?!\.describe)/g,
              "question: $1.string().min(1).describe(\"What to look for in the full text; passages are selected by relevance to it.\")"
            );
            if (c !== before) { modified = true; logs.push("research-param-desc"); }
          }

          // 12. Disable find_tools (cloud-only): self-hosted api has no
          //     Alexandria catalogue, every call fails with "Alexandria
          //     requires an API key on a team with Alexandria access".
          //     The registration is a single unconditional statement.
          if (c.includes("server.addTool(findToolsTool);")) {
            c = c.replace(
              "server.addTool(findToolsTool);",
              "/* find-tools-disabled: no Alexandria catalogue in self-host */"
            );
            modified = true; logs.push("find-tools-disable");
          }

          // 13. Strip dead Alexandria guidance from the scrape/search
          //     descriptions: the paragraphs point at find_tools and the
          //     alexandria scrape mode, which cannot work self-hosted and
          //     otherwise lure the model into guaranteed-failure calls.
          //     Delete whole template paragraphs; anchors verified unique.
          //     Param-level .describe() mentions are left alone (dead but
          //     harmless). search-surface variants are /v2/mcp-search only,
          //     not used here.
          {
            const before = c;
            c = c.replace(
              "\n\nOn an authenticated session with Alexandria access, \\`firecrawl_search\\` with \\`sources\\` unset and \\`firecrawl_find_tools\\` can discover providers for the same fields across several pages; a matching provider returns typed records in one call. Keyless sessions have no provider matches.\n\nAlexandria mode, on an authenticated session with Alexandria access: \\`alexandria\\` selects catalogued capability execution and is mutually exclusive with \\`url\\`.\n",
              "\n"
            );
            c = c.replace(
              "\n\n$${ALEXANDRIA_SEARCH_LEAD}\n\nOn an authenticated session, tool matches describe available capabilities; \\`firecrawl_find_tools\\` returns their contracts and \\`firecrawl_scrape\\` with an \\`alexandria\\` body executes a selected capability. Keyless sessions get no Alexandria matches in data.tools.",
              ""
            );
            if (c !== before) { modified = true; logs.push("alexandria-desc-strip"); }
          }

          // 13b. Same strip for the search-surface scrape description
          //      variant. Needle refreshed 2026-10-23: 3.33.4 says "a
          //      matching Alexandria provider" (the earlier needle missed
          //      the extra word and went permanently no-op) and ends with
          //      an Alexandria billing sentence; both die together.
          if (c.includes("can discover providers for the same fields across several pages")) {
            const before = c;
            c = c.replace(
              "\n\n\\`firecrawl_search\\` and \\`firecrawl_find_tools\\` can discover providers for the same fields across several pages; a matching Alexandria provider returns typed records in one call.\n\nAlexandria mode: \\`alexandria\\` selects catalogued capability execution and is mutually exclusive with \\`url\\`. Alexandria execution is billed per capability (pass includeCosts to firecrawl_find_tools to see prices if you need).\n",
              "\n"
            );
            if (c !== before) { modified = true; logs.push("alexandria-desc-strip-v2"); }
          }

          // 14. (tombstoned 2026-10-22) gov-search re-enabled. Cloud
          //     Government Index is free and answers keyless requests
          //     (no Authorization header). The tool shares the SDK client
          //     whose baseURL is FIRECRAWL_API_URL -- self-host has no gov
          //     route, so #17 below re-points BASE2 at the cloud/rotator.
          //     docs/gov-search-investigation.md.

          // 17. Route gov_search to the cloud Government Index. axios
          //     ignores baseURL for absolute URLs, so overriding BASE2 with
          //     a full URL redirects only this tool; every other tool keeps
          //     hitting the self-host API. Default is the public cloud
          //     endpoint (free + keyless, proven 2026-10-22); project env
          //     FIRECRAWL_GOV_BASE_URL can point at the internal
          //     key-rotator prefix for higher rate limits and audit logs.
          //     No API key is ever sent from this service either way.
          if (c.includes("var BASE2 = \"/v2/search/gov\";")) {
            c = c.replace(
              "var BASE2 = \"/v2/search/gov\";",
              "var BASE2 = (process.env.FIRECRAWL_GOV_BASE_URL || \"https://api.firecrawl.dev\").replace(/\\/$/, \"\") + \"/v2/search/gov\";"
            );
            modified = true; logs.push("gov-base-url");
          }

          // 17b. The SDK pins every request back onto the FIRECRAWL_API_URL
          //     origin (pinToApiOrigin in node_modules, an anti-credential-
          //     leak guard), which would drag the absolute BASE2 from #17
          //     right back to the self-host API (observed: gov call still
          //     dialed the local origin). Gov therefore bypasses
          //     client.http with a plain fetch: no key is ever sent, the
          //     key-rotator injects its own when FIRECRAWL_GOV_BASE_URL
          //     points at it, and the shaped result ({data: json}) matches
          //     what the execute body reads below. Lost for this one call:
          //     axios retries and the 300s timeout -- acceptable for a
          //     free cloud lookup. \x60 keeps raw backticks out of this
          //     single-quoted body per the sh transport rule; the two-char
          //     $$ form inside needles is compose-escape and lands as a
          //     single $ once compose interpolates.
          if (c.includes("const res = await client.http.get(\n        " + backtick + "$" + "{BASE2}?" + "$" + "{params.toString()}" + backtick + ",\n        originHeaders(requestOrigin(mcpClient, session))\n      );")) {
            c = c.replace(
              "const res = await client.http.get(\n        " + backtick + "$" + "{BASE2}?" + "$" + "{params.toString()}" + backtick + ",\n        originHeaders(requestOrigin(mcpClient, session))\n      );",
              "const res = await fetch(\n        " + backtick + "$" + "{BASE2}?" + "$" + "{params.toString()}" + backtick + "\n      ).then(async (r) => ({ data: await r.json() }));"
            );
            modified = true; logs.push("gov-fetch-bypass");
          }

          // 15. Strip cloud-only guidance from FULL/KEYLESS profile
          //     instructions. The initialize instructions steer the agent more
          //     strongly than any single tool description (read first, every
          //     session): they still steer toward firecrawl_agent/-
          //     agent_status (disabled by #7), firecrawl_find_tools (#12),
          //     firecrawl_monitor_* (#6), and the Alexandria catalogue
          //     surface (no backend on self-host -- a guaranteed-dead
          //     pointer per session). firecrawl_gov_search is back (see #14
          //     tombstone): the gov shards below keep its live pointers.
          //     Both interpolation
          //     sources ALEXANDRIA_CATALOGUE_SENTENCE /
          //     ALEXANDRIA_SOURCES_ALWAYS_ON are blanked so every other
          //     hidden reference degrades to an empty string too.
          //     Dist bundles keep raw backslash-quote in Firecrawl\\x27s and
          //     a single-quoted string for SOURCES_ALWAYS_ON, so both source
          //     assignments are matched with hex-class regexes -- zero raw
          //     apostrophe in this body per AGENTS.md the sh transport rule.
          {
            const before = c;

            // 15a. Blank the two Alexandria interpolation consts. Dist bundles
            //     both as single-expression consts ending with ; before the
            //     next var -- match [^]*? up to the final quote boundary so
            //     upstream wording drift still lands on the whole assignment.
            c = c.replace(
              /var ALEXANDRIA_CATALOGUE_SENTENCE = "Alexandria is Firecrawl[^]*?published contracts\."/,
              "var ALEXANDRIA_CATALOGUE_SENTENCE = \"\""
            );
            c = c.replace(
              /var ALEXANDRIA_SOURCES_ALWAYS_ON = [\x22\x27]Authenticated searches[^]*?website-matched tools only\.[\x22\x27]/,
              "var ALEXANDRIA_SOURCES_ALWAYS_ON = \"\""
            );

            // 15b. FULL: capability-list opener -- drop monitoring and
            //     multi-source research wording (agent + monitor both off).
            c = c.replace(
              "Firecrawl provides web search, page retrieval, site URL discovery, multi-page collection, structured page data, monitoring, and multi-source research that returns structured data.",
              "Firecrawl provides web search, page retrieval, site URL discovery, multi-page collection, and structured page data."
            );

            // 15c. FULL: rewrite tool-boundary sentence (drop agent/agent_status).
            c = c.replace(
              "Match the requested operation to the tool boundary: firecrawl_scrape retrieves one supplied page and can return JSON matching a supplied schema, firecrawl_map enumerates URLs under a site without retrieving their content, and firecrawl_agent runs multi-source research and returns structured data when the URLs are not known or the answer spans several sites (an entity plus its fields, a list, a dataset); its result is read with firecrawl_agent_status.",
              "Match the requested operation to the tool boundary: firecrawl_scrape retrieves one supplied page and can return JSON matching a supplied schema, and firecrawl_map enumerates URLs under a site without retrieving their content."
            );

            // 15d. FULL: strip Alexandria provider/discovery sentences.
            c = c.replace(
              " Authenticated firecrawl_search returns web results together with matching Alexandria providers in data.tools.",
              ""
            );
            c = c.replace(
              " $${ALEXANDRIA_CATALOGUE_SENTENCE} A matching provider can return the same fields across several entities, provenance, exact figures or timestamps, or a large set of records through firecrawl_scrape with its published contract.",
              ""
            );
            c = c.replace(
              " For the same fields across multiple pages, firecrawl_find_tools offers free provider discovery. Use firecrawl_find_tools to read a contract that was not returned in full or to browse the catalogue by category.",
              ""
            );
            c = c.replace(
              " $${ALEXANDRIA_SOURCES_ALWAYS_ON} If no provider fits, continue with web search or firecrawl_agent.",
              ""
            );

            // 15e. FULL: strip the alexandria half of the tail block; the
            //     firecrawl_gov_search half stays (live tool, routed by #17).
            //     Also strip the categories-gov tail of that same sentence:
            //     firecrawl_search hits the self-host API which has no
            //     Government Index, so categories: [gov] is a dead pointer.
            c = c.replace(
              " firecrawl_search with sources: [{type: \"alexandria\"}] returns compact tool summaries in data.tools; toolDetail: \"full\" includes contracts, firecrawl_find_tools starts with categories, lists providers, then compact tools, and expands the selected full contract, and firecrawl_scrape with alexandria: [{provider, capability, options}] executes up to ten capabilities and returns their results. Alexandria access needs an API key on a team with it enabled.",
              ""
            );
            c = c.replace(
              "; firecrawl_search with categories: [\"gov\"] reaches the same sources and cannot be combined with other categories.",
              "."
            );
            c = c.replace(
              "; firecrawl_search with categories: [\"gov\"] reaches the same sources in the web group and cannot be combined with other categories.",
              "."
            );

            // 15f. KEYLESS: rewrite the categories-gov line to point at the
            //     live tool (self-host search has no Government Index).
            c = c.replace(
              " For legal or regulatory questions, firecrawl_search with categories: [\"gov\"] searches US government legal and regulatory sources and cannot be combined with other categories.",
              " For legal or regulatory questions, firecrawl_gov_search searches US government legal and regulatory sources."
            );

            // 15g. KEYLESS: rewrite bearer-key tail (drop agent/find_tools/
            //     Alexandria; keep the restored gov tool in the listing).
            c = c.replace(
              "An Authorization bearer API key can provide higher usage limits and expose additional tools, subject to plan, deployment, and team policy, including firecrawl_map for site URL discovery, firecrawl_agent and firecrawl_agent_status for multi-source research that returns structured data when the URLs are not known, firecrawl_research_* for paper-index and repository research, and firecrawl_find_tools as the progressive Alexandria catalogue lookup alongside the Alexandria options of firecrawl_search and firecrawl_scrape for catalogued data providers.",
              "An Authorization bearer API key can provide higher usage limits and expose additional tools, subject to plan, deployment, and team policy, including firecrawl_map for site URL discovery, firecrawl_gov_search for US government legal and regulatory sources, and firecrawl_research_* for paper-index and repository research."
            );

            // 15h. firecrawl_search and mcp-search descriptions: the
            //     categories-gov phrasing is a dead pointer on self-host
            //     (no Government Index behind /v2/search); rewrite both
            //     copies to point at firecrawl_gov_search instead, which #17
            //     routes to the cloud. Needles stop before the upstream
            //     Verify-sentence (contains a raw apostrophe -- forbidden
            //     in this body) so that sentence stays untouched. Dist
            //     holds escaped backticks and plain quotes in these
            //     template literals; needles mirror those exact bytes.
            //     Exact-string needles, no regex -- the 2026-10-22
            //     runaway-regex incident (unbounded span ate the
            //     SEARCH_PROFILE region) stays documented in history.
            c = c.replace(
              " For a legal or regulatory question, \\`categories: [\"gov\"]\\` returns hits in \\`data.web\\` with \\`category: \"gov\"\\` and cannot be combined with other categories; authenticated sessions also have \\`firecrawl_gov_search\\` as the dedicated tool.",
              " For a legal or regulatory question, firecrawl_gov_search searches US government legal and regulatory sources."
            );
            c = c.replace(
              " For a legal or regulatory question, \\`categories: [\"gov\"]\\` returns results in \\`data.web\\` with \\`category: \"gov\"\\` and cannot be combined with other categories; \\`firecrawl_gov_search\\` is the dedicated tool.",
              " For a legal or regulatory question, firecrawl_gov_search searches US government legal and regulatory sources."
            );

            // 15j. SEARCH_PROFILE_INSTRUCTIONS (firecrawl_search service
            //     profile): the full list-of-features sentence still names
            //     firecrawl_find_tools and Alexandria catalogue copy. Strip
            //     per sentence so wording drift in the preamble stays no-op.
            c = c.replace(
              " Use firecrawl_search to find relevant results across the web and specialized indexes; authenticated searches also return matching Alexandria providers in data.tools. firecrawl_find_tools provides catalogue browsing and provider contracts; firecrawl_scrape with an alexandria body executes a selected capability; firecrawl_scrape with a url retrieves one supplied page.",
              " Use firecrawl_search to find relevant results across the web and specialized indexes. firecrawl_scrape with a url retrieves one supplied page."
            );
            // (research-filter sentence kept 2026-10-23: categories:
            //     ["research"] is a LIVE SearXNG query rewrite on the
            //     self-host api -- verified 2 results returned. Official
            //     wording stays.)
            // Billing: delete the whole sentence (user ruling 2026-10-23:
            //     billing text is cloud-only and meaningless to the model
            //     on a self-host stack; removing wholesale also shrinks the
            //     drift surface vs a rewrite).
            c = c.replace(
              " Billing: web, developer, and research search are billed per request; government search is free; Alexandria discovery (firecrawl_search with sources [\"alexandria\"] alone, and firecrawl_find_tools) is free; firecrawl_scrape is billed, as a page retrieval in url mode or per executed capability in alexandria mode (pass includeCosts to firecrawl_find_tools to see prices).",
              ""
            );

            // 15k. (rewritten 2026-10-23) SEARCH_PROFILE_INSTRUCTIONS used
            //     to be blob-rewritten as a whole; that dropped live gov /
            //     research wording together with the dead Alexandria copy
            //     and rewrote the billing line for no functional reason.
            //     Now three surgical replaces instead, keeping everything
            //     else byte-official:
            //       a) enum tail: drop the Alexandria provider claim, keep
            //          government in the enumeration (gov tool is live).
            //          Needle ends before the period so the sentence
            //          boundary survives ("...research search. Use ...").
            c = c.replace(
              ", and executes catalogued Alexandria data providers",
              ""
            );
            //       b) gov tail: categories:["gov"] is a silent-empty dead
            //          pointer on the self-host api (verified 2026-10-23:
            //          HTTP 200 with data.web: []). The preceding sentence
            //          already names firecrawl_gov_search, so the tail just
            //          collapses to a period. (web-group variant here; the
            //          plain variant is handled in 15e.)
            c = c.replace(
              "; firecrawl_search with categories: [\"gov\"] reaches the same sources in the web group and cannot be combined with other categories.",
              "."
            );
            //       c) billing sentence: handled by the 15j replace above
            //          (single occurrence in this blob).
            //     ALEXANDRIA_SEARCH_INSTRUCTIONS prefix const is blanked by
            //     15a, so the "+ `...`" template shape stays official.

            // 15l. searchQueryIsValid refine error message in the live
            //     firecrawl_search tool still points at the disabled
            //     firecrawl_find_tools -- the agent sees this string on an
            //     empty query. Rewrite it.
            c = c.replace(
              "A query is required. Use firecrawl_find_tools to browse the catalogue.",
              "A query is required."
            );

            // 15m. scrapeOptions billing clause: "billed as a scrape" is
            //     cloud metering text, meaningless on a self-host stack
            //     (user ruling 2026-10-23). Drop only the clause; the
            //     functional guidance (full-page fetch per result) stays.
            c = c.replace(
              ", and each fetched result is billed as a scrape",
              ""
            );

            if (c !== before) { modified = true; logs.push("instr-desc-strip"); }
          }

          if (modified) {
            fs.writeFileSync(f, c);
            n++;
            console.log("Patched [" + logs.join(",") + "]: " + f);
          }
        }
        console.log("Total patched: " + n);
        ' && exec node /tmp/app-root/dist/index.js
    expose:
      - "3000"
    environment:
      FIRECRAWL_API_URL: "http://api:3002"
      # 对外域名透传：启动 patch 的 REMOTE PARSE NOTE 用它写 parse 端点
      FIRECRAWL_DOMAIN: ${FIRECRAWL_DOMAIN}
      # FastMCP 的 Host 白名单（DNS-rebinding 防护）。镜像内默认只放行
      # localhost/127.0.0.1/[::1]（HOST=0.0.0.0 属通配，会被跳过），所以经
      # traefik 进来、Host=对外域名的请求会被 403「Forbidden: Host ... is not
      # allowed」——2026-11-07 Arcane 整体重建后 mcp 全部工具 403 就是这个原因
      # （此前两个月未重建过，跑的还是不带该校验的旧进程）。这里显式放行本栈域名。
      FIRECRAWL_MCP_ALLOWED_HOSTS: ${FIRECRAWL_DOMAIN}
      FIRECRAWL_RETRY_MAX_ATTEMPTS: "10"
      FIRECRAWL_RETRY_INITIAL_DELAY: "500"
      FIRECRAWL_NO_SEARCH_FEEDBACK: "true"
      FIRECRAWL_NO_ENDPOINT_FEEDBACK: "true"
      # gov 检索云端路由（#17 生效）：不设=云端免费档 keyless 直连；
      # 设为 key-rotator 前缀（http://<rotator>:8788/firecrawl，不带尾斜杠）
      # 则走带 key 通道，速率上限高且有审计日志。内网主机名按安全原则走项目 env。
      FIRECRAWL_GOV_BASE_URL: ${FIRECRAWL_GOV_BASE_URL}
      HTTP_STREAMABLE_SERVER: "true"
      HOST: "0.0.0.0"
    networks:
      - backend
      - reverse-proxy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 5 wget -q -T 5 -O /dev/null http://127.0.0.1:3000/health
          && { touch /tmp/mcp-hc-ok 2>/dev/null || true; rm -f /tmp/mcp-hc-fail 2>/dev/null || true; exit 0; };
          n=$$(cat /tmp/mcp-hc-fail 2>/dev/null);
          n=$$(( $${n:-0} + 1 ));
          echo "$$n" > /tmp/mcp-hc-fail 2>/dev/null || n=3;
          if [ -f /tmp/mcp-hc-ok ] && [ "$$n" -ge 3 ]; then
            m="[SELF-HEAL] $$(date -Iseconds) mcp unresponsive for $$n checks; killing node";
            echo "$$m" >&2;
            echo "$$m" >> /proc/1/fd/2 2>/dev/null || true;
            pkill -KILL -f '^node /tmp/app-root/dist/index\.js$$';
          fi;
          exit 1
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 60s
      start_interval: 2s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.mcp-fc.rule=Host(`${FIRECRAWL_DOMAIN}`) && (PathPrefix(`/v2/mcp`) || PathPrefix(`/mcp`) || PathPrefix(`/sse`) || PathPrefix(`/messages`))"
      - "traefik.http.routers.mcp-fc.entrypoints=websecure"
      - "traefik.http.routers.mcp-fc.tls=true"
      - "traefik.http.routers.mcp-fc.middlewares=mcp-v2-to-legacy"
      - "traefik.http.routers.mcp-fchttp.rule=Host(`${FIRECRAWL_DOMAIN}`) && (PathPrefix(`/v2/mcp`) || PathPrefix(`/mcp`) || PathPrefix(`/sse`) || PathPrefix(`/messages`))"
      - "traefik.http.routers.mcp-fchttp.entrypoints=web"
      - "traefik.http.routers.mcp-fchttp.middlewares=http2https,mcp-v2-to-legacy"
      - "traefik.http.middlewares.mcp-v2-to-legacy.replacepathregex.regex=^/v2/mcp(/.*)?$$"
      - "traefik.http.middlewares.mcp-v2-to-legacy.replacepathregex.replacement=/mcp$$1"

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true
  owui:
    name: open-webui-nogpu_default
    external: true

volumes:
  redis:
  postgres:
