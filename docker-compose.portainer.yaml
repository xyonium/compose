# Portainer 自定义层：与上游 docker-compose.upstream.yaml 合并使用
# 合并产物 docker-compose.yaml 由 main 分支的 sync-sub2api.yml 工作流生成
#（bot 维护，勿手改）；要调整部署只改本文件。
#
# 自定义内容：
#   1. 镜像全部走私服 mirror（jcr.savorcare.com 的 docker hub 代理）
#   2. sub2api 摘掉宿主端口映射，改走 traefik（sub2api.savorcare.com）
#   3. 固定项目名 sub2api，数据卷名不随 Portainer stack 名变化

name: sub2api

services:
  sub2api:
    image: jcr.savorcare.com/docker/weishaw/sub2api:latest
    # 不暴露宿主端口（清掉上游的 ${BIND_HOST}:${SERVER_PORT}:8080 映射），
    # 外部访问走 traefik；容器 8080 经 reverse-proxy 网络可达
    ports: !reset null
    networks:
      # compose 合并语义：与上游的 sub2api-network 合并为两者都挂
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      # 摘掉宿主端口后 traefik 无从猜测容器端口，显式钉死
      - "traefik.http.services.sub2api.loadbalancer.server.port=8080"
      - "traefik.http.routers.sub2api.rule=Host(`sub2api.savorcare.com`)"
      - "traefik.http.routers.sub2api.entrypoints=websecure"
      - "traefik.http.routers.sub2api.tls.certresolver=myresolver"
      - "traefik.http.routers.sub2api.tls.domains[0].main=savorcare.com"
      - "traefik.http.routers.sub2api.tls.domains[0].sans=*.savorcare.com"
      - "traefik.http.routers.sub2apihttp.rule=Host(`sub2api.savorcare.com`)"
      - "traefik.http.routers.sub2apihttp.entrypoints=web"

  postgres:
    image: jcr.savorcare.com/docker/postgres:18-alpine

  redis:
    image: jcr.savorcare.com/docker/redis:8-alpine

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true
