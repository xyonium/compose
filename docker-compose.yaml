      CELERY_WORKER_CONCURRENCY: ${KNOWLEDGE_FS_UPGRADE_WORKER_AMOUNT:-2}
      CELERY_WORKER_POOL: prefork
      CELERY_WORKER_QUEUES: knowledge_fs_upgrade
      MODE: worker
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/langgenius/dify-api:1.19.0@sha256:0d67842aedcb9b5884f75b88c4a5dd812e637916bff1ca892831f7ace2f3204f
    networks:
      default: null
      ssrf_proxy_network: null
    profiles:
      - knowledge-fs
    restart: always
    volumes:
      - bind:
          create_host_path: true
        source: ./volumes/app/storage
        target: /app/api/storage
        type: bind
