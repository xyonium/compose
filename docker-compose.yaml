      start_period: 60s
      test:
        - CMD-SHELL
        - celery -A celery_healthcheck.celery inspect ping
      timeout: ${COMPOSE_WORKER_HEALTHCHECK_TIMEOUT:-30s}
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/langgenius/dify-api:1.19.0@sha256:0d67842aedcb9b5884f75b88c4a5dd812e637916bff1ca892831f7ace2f3204f
    networks:
      default: null
      ssrf_proxy_network: null
    restart: always
    volumes:
      - source: app
        target: /app/api/storage
        type: volume
        volume: {}
  worker_knowledge_fs_upgrade:
    depends_on:
      db_mysql:
        condition: service_healthy
        required: false
      db_postgres:
        condition: service_healthy
        required: false
      init_permissions:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_started
        required: true
    environment:
