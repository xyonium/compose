name: netbird
networks:
  default:
    name: netbird_default
  reverse-proxy:
    external: true
    name: reverse-proxy
services:
  dashboard:
    container_name: netbird-dashboard
    environment:
      AUTH_AUDIENCE: netbird-dashboard
      AUTH_AUTHORITY: https://${NETBIRD_DOMAIN}/oauth2
      AUTH_CLIENT_ID: netbird-dashboard
      AUTH_CLIENT_SECRET: ""
      AUTH_REDIRECT_URI: /nb-auth
      AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
      AUTH_SUPPORTED_SCOPES: openid profile email groups
      LETSENCRYPT_DOMAIN: none
      NETBIRD_AGENT_NETWORK_ENABLED: "true"
      NETBIRD_CSP: wss://relay.${NETBIRD_DOMAIN}:9443
      NETBIRD_MGMT_API_ENDPOINT: https://${NETBIRD_DOMAIN}
      NETBIRD_MGMT_GRPC_API_ENDPOINT: https://${NETBIRD_DOMAIN}
      NETBIRD_WASM_PATH: https://pkgs.netbird.io/wasm/client/v0.81.4
      NGINX_SSL_PORT: "443"
      USE_AUTH0: "false"
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/netbirdio/dashboard@sha256:340b13c00b84349572a2acc5605e907cb09250a9e6461c757097eabdb8e02f2c
    labels:
      - traefik.enable=true
      - traefik.http.routers.netbird-dashboard.rule=Host(`${NETBIRD_DOMAIN}`)
      - traefik.http.routers.netbird-dashboard.entrypoints=websecure
      - traefik.http.routers.netbird-dashboard.tls=true
      - traefik.http.routers.netbird-dashboard.priority=1
      - traefik.http.services.netbird-dashboard.loadbalancer.server.port=80
      - traefik.http.routers.netbird-http.rule=Host(`${NETBIRD_DOMAIN}`)
      - traefik.http.routers.netbird-http.entrypoints=web
      - traefik.http.routers.netbird-http.middlewares=http2https
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 500m
    networks:
      reverse-proxy: null
    restart: unless-stopped
  netbird-server:
    command:
      - --config
      - /etc/netbird/config.yaml
    container_name: netbird-server
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/netbirdio/netbird-server@sha256:7b5b53b2dc8bc25639f791cf72d47cf86911894ff3f8a97cb79bab9be958109c
    labels:
      - traefik.enable=true
      - traefik.http.routers.netbird-grpc.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      - traefik.http.routers.netbird-grpc.entrypoints=websecure
      - traefik.http.routers.netbird-grpc.tls=true
      - traefik.http.routers.netbird-grpc.service=netbird-server-h2c
      - traefik.http.routers.netbird-backend.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      - traefik.http.routers.netbird-backend.entrypoints=websecure
      - traefik.http.routers.netbird-backend.tls=true
      - traefik.http.routers.netbird-backend.service=netbird-server
      - traefik.http.services.netbird-server.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.scheme=h2c
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 500m
    networks:
      reverse-proxy: null
    restart: unless-stopped
    volumes:
      - source: netbird_data
        target: /var/lib/netbird
        type: volume
        volume: {}
      - source: netbird_config
        target: /etc/netbird
        type: volume
        volume: {}
  proxy:
    container_name: netbird-proxy
    depends_on:
      netbird-server:
        condition: service_started
        required: true
    environment:
      NB_PROXY_ACME_CERTIFICATES: "false"
      NB_PROXY_ADDRESS: :8443
      NB_PROXY_ALLOW_INSECURE: "true"
      NB_PROXY_CERTIFICATE_DIRECTORY: /wildcard-certs
      NB_PROXY_CERTIFICATE_FILE: fullchain.pem
      NB_PROXY_CERTIFICATE_KEY_FILE: key.pem
      NB_PROXY_DEBUG_LOGS: "false"
      NB_PROXY_DOMAIN: ${NETBIRD_DOMAIN}
      NB_PROXY_FORWARDED_PROTO: https
      NB_PROXY_MANAGEMENT_ADDRESS: http://netbird-server:80
      NB_PROXY_PRIVATE: "true"
      NB_PROXY_PROXY_PROTOCOL: "false"
      NB_PROXY_TOKEN: ${NB_PROXY_TOKEN}
      NB_PROXY_WG_PORT: "51821"
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/netbirdio/reverse-proxy@sha256:cc0deaed250ca1332e28f40caca780055cdda7871750cb020478f6fe96e1f6d7
    labels:
      - traefik.enable=false
    logging:
      driver: json-file
      options:
        max-file: "2"
        max-size: 500m
    networks:
      reverse-proxy: null
    ports:
      - mode: ingress
        protocol: udp
        published: "51821"
        target: 51821
    restart: unless-stopped
    volumes:
      - source: netbird_proxy_certs
        target: /certs
        type: volume
        volume: {}
      - read_only: true
        source: /${NETBIRD_CERT_DIR}
        target: /wildcard-certs
        type: bind
  relay:
    container_name: netbird-relay
    environment:
      NB_AUTH_SECRET: ${NB_RELAY_AUTH_SECRET}
      NB_ENABLE_STUN: "true"
      NB_EXPOSED_ADDRESS: rels://relay.${NETBIRD_DOMAIN}:9443
      NB_LISTEN_ADDRESS: :9443
      NB_LOG_LEVEL: info
      NB_STUN_PORTS: "3479"
      NB_TLS_CERT_FILE: /certs/fullchain.pem
      NB_TLS_KEY_FILE: /certs/key.pem
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/netbirdio/relay@sha256:8f6b9e4193653ede89e83dd4aa4e2cf2562579b3e2481dcf259a7ab28bcd5fa1
    networks:
      default: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "9443"
        target: 9443
      - mode: ingress
        protocol: udp
        published: "9443"
        target: 9443
      - mode: ingress
        protocol: udp
        published: "3479"
        target: 3479
    restart: unless-stopped
    volumes:
      - read_only: true
        source: /${NETBIRD_CERT_DIR}
        target: /certs
        type: bind
      - source: relay_data
        target: /data
        type: volume
        volume: {}
volumes:
  netbird_config:
    name: netbird_netbird_config
  netbird_data:
    name: netbird_netbird_data
  netbird_proxy_certs:
    name: netbird_netbird_proxy_certs
  relay_data:
    name: netbird_relay_data
