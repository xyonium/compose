name: n8n
networks:
  default:
    name: n8n_default
  reverse-proxy:
    external: true
    name: reverse-proxy
services:
  n8n:
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      - N8N_DEPLOYMENT_ARTIFACT=docker-compose
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    image: ${JCR_REGISTRY}/docker/n8nio/n8n@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    labels:
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8nhttp.rule=Host(`${N8N_DOMAIN}`)
      - traefik.http.routers.n8nhttp.entrypoints=web
      - traefik.http.routers.n8nhttp.middlewares=http2https
    networks:
      reverse-proxy: null
    restart: always
    volumes:
      - source: n8n_storage
        target: /home/node/.n8n
        type: volume
        volume: {}
  n8n-runner:
    depends_on:
      n8n:
        condition: service_started
        required: true
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    image: ${JCR_REGISTRY}/docker/n8nio/runners@sha256:255e69ed23d8b3866e593f6e105e7e12cafc81c4d1966a8f8702115af1032461
    networks:
      default: null
    restart: always
  n8n-worker:
    command: worker
    depends_on:
      n8n:
        condition: service_started
        required: true
    environment:
      - N8N_DEPLOYMENT_ARTIFACT=docker-compose
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    image: ${JCR_REGISTRY}/docker/n8nio/n8n@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    networks:
      default: null
    restart: always
    volumes:
      - source: n8n_storage
        target: /home/node/.n8n
        type: volume
        volume: {}
  n8n-worker-runner:
    depends_on:
      n8n-worker:
        condition: service_started
        required: true
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker:5679
    image: ${JCR_REGISTRY}/docker/n8nio/runners@sha256:255e69ed23d8b3866e593f6e105e7e12cafc81c4d1966a8f8702115af1032461
    networks:
      default: null
    restart: always
  postgres:
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
      - PGDATA=/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      timeout: 5s
    image: ${JCR_REGISTRY}/docker/postgres:16-alpine
    networks:
      default: null
    restart: always
    volumes:
      - source: db_storage
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        source: /home/runner/work/compose/compose/init-data.sh
        target: /docker-entrypoint-initdb.d/init-data.sh
        type: bind
  redis:
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    image: ${JCR_REGISTRY}/docker/redis:7-alpine
    networks:
      default: null
    restart: always
    volumes:
      - source: redis_storage
        target: /data
        type: volume
        volume: {}
volumes:
  db_storage:
    name: n8n_db_storage
  n8n_storage:
    name: n8n_n8n_storage
  redis_storage:
    name: n8n_redis_storage
x-runner:
  environment:
    - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
  image: n8nio/runners:${N8N_VERSION}
  restart: always
x-shared:
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    - N8N_DEPLOYMENT_ARTIFACT=docker-compose
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - N8N_ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - N8N_RUNNERS_MODE=external
    - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
  restart: always
  volumes:
    - n8n_storage:/home/node/.n8n
