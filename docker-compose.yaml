name: dify
networks:
  agent_sandbox_network:
    driver: bridge
    internal: true
    name: dify_agent_sandbox_network
  default:
    external: true
    name: reverse-proxy
  local_sandbox_proxy_network:
    driver: bridge
    internal: true
    name: dify_local_sandbox_proxy_network
  milvus:
    driver: bridge
    name: dify_milvus
  opensearch-net:
    driver: bridge
    internal: true
    name: dify_opensearch-net
  ssrf_proxy_network:
    driver: bridge
    internal: true
    name: dify_ssrf_proxy_network
services:
  agent_backend:
    depends_on:
      plugin_daemon:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: ${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:-${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-}}
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/langgenius/dify-agent-backend:1.19.0
    networks:
      agent_sandbox_network: null
      default: null
    restart: always
  agent_ssrf_proxy:
    entrypoint:
      - sh
      - -c
      - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    environment:
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-}
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/ubuntu/squid:latest
    networks:
      default: null
      local_sandbox_proxy_network: null
    restart: always
    volumes:
      - bind:
          create_host_path: true
        source: ./ssrf_proxy/squid-agent.conf.template
        target: /etc/squid/squid.conf.template
        type: bind
      - bind:
          create_host_path: true
        source: ./ssrf_proxy/squid-common.conf.template
        target: /etc/squid/dify_common.conf.template
        type: bind
      - bind:
          create_host_path: true
        source: ./ssrf_proxy/docker-agent-entrypoint.sh
        target: /docker-entrypoint-mount.sh
        type: bind
  api:
    depends_on:
      agent_backend:
        condition: service_started
        required: true
      db_mysql:
        condition: service_healthy
        required: false
      db_postgres:
        condition: service_healthy
        required: false
      init_permissions:
        condition: service_completed_successfully
        required: true
      oceanbase:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
        required: true
      seekdb:
        condition: service_healthy
        required: false
    environment:
      MODE: api
    expose:
      - "5001"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5001/health
      timeout: 5s
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/langgenius/dify-api:1.19.0@sha256:0d67842aedcb9b5884f75b88c4a5dd812e637916bff1ca892831f7ace2f3204f
    labels:
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      - traefik.http.services.difyapi.loadbalancer.server.port=5001
      - traefik.http.routers.difyapi.rule=Host(`${DIFY_DOMAIN}`) && (PathPrefix(`/console/api`)||PathPrefix(`/api`)||PathPrefix(`/v1`)||PathPrefix(`/files`))
      - traefik.http.routers.difyapi.entrypoints=websecure
      - traefik.http.routers.difyapi.tls=true
      - traefik.http.routers.difyapihttp.rule=Host(`${DIFY_DOMAIN}`) && (PathPrefix(`/console/api`)||PathPrefix(`/api`)||PathPrefix(`/v1`)||PathPrefix(`/files`))
      - traefik.http.routers.difyapihttp.entrypoints=web
      - traefik.http.routers.difyapihttp.middlewares=http2https
    networks:
      default: null
      ssrf_proxy_network: null
    restart: always
    volumes:
      - source: app
        target: /app/api/storage
        type: volume
        volume: {}
  api_websocket:
    depends_on:
      db_mysql:
        condition: service_healthy
        required: false
      db_postgres:
        condition: service_healthy
        required: false
      init_permissions:
        condition: service_completed_successfully
        required: true
      redis:
        condition: service_started
        required: true
    entrypoint:
      - /bin/bash
      - -c
      - |
        export SERVER_WORKER_AMOUNT="$${API_WEBSOCKET_WORKER_AMOUNT:-1}"
        export SERVER_WORKER_CLASS="$${API_WEBSOCKET_WORKER_CLASS:-geventwebsocket.gunicorn.workers.GeventWebSocketWorker}"
        export SERVER_WORKER_CONNECTIONS="$${API_WEBSOCKET_WORKER_CONNECTIONS:-1000}"
        export GUNICORN_TIMEOUT="$${API_WEBSOCKET_GUNICORN_TIMEOUT:-360}"
        exec /bin/bash /entrypoint.sh
    environment:
      MODE: api
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/langgenius/dify-api:1.19.0@sha256:0d67842aedcb9b5884f75b88c4a5dd812e637916bff1ca892831f7ace2f3204f
    networks:
      default: null
      ssrf_proxy_network: null
    profiles:
      - collaboration
    restart: always
    volumes:
      - source: app
        target: /app/api/storage
        type: volume
        volume: {}
  certbot:
    command:
      - tail
      - -f
      - /dev/null
    entrypoint:
      - /docker-entrypoint.sh
    env_file:
      - path: ./envs/infrastructure/certbot.env
        required: false
      - path: ./envs/infrastructure/certbot.defaults
        required: true
    image: certbot/certbot
    networks:
      default: null
    profiles:
      - certbot
    volumes:
      - bind:
          create_host_path: true
        source: ./volumes/certbot/conf
        target: /etc/letsencrypt
        type: bind
      - bind:
          create_host_path: true
        source: ./volumes/certbot/www
        target: /var/www/html
        type: bind
      - bind:
          create_host_path: true
        source: ./volumes/certbot/logs
        target: /var/log/letsencrypt
        type: bind
      - bind:
          create_host_path: true
        source: ./volumes/certbot/conf/live
        target: /etc/letsencrypt/live
        type: bind
      - bind:
          create_host_path: true
        source: ./certbot/update-cert.template.txt
        target: /update-cert.template.txt
        type: bind
      - bind:
          create_host_path: true
        source: ./certbot/docker-entrypoint.sh
        target: /docker-entrypoint.sh
        type: bind
  chroma:
    env_file:
      - path: ./envs/vectorstores/chroma.env
        required: false
      - path: ./envs/vectorstores/chroma.defaults
        required: true
    image: ghcr.io/chroma-core/chroma:0.5.20
    networks:
      default: null
    profiles:
      - chroma
    restart: always
    volumes:
      - bind:
          create_host_path: true
        source: ./volumes/chroma
        target: /chroma/chroma
        type: bind
  couchbase-server:
    build:
      context: ./couchbase-server
      dockerfile: Dockerfile
    command: sh -c "/opt/couchbase/init/init-cbserver.sh"
    container_name: couchbase-server
    entrypoint:
      - ""
    env_file:
      - path: ./envs/vectorstores/couchbase.env
        required: false
      - path: ./envs/vectorstores/couchbase.defaults
        required: true
    environment:
      - CLUSTER_NAME=dify_search
      - COUCHBASE_BUCKET_RAMSIZE=512
      - COUCHBASE_RAM_SIZE=2048
      - COUCHBASE_EVENTING_RAM_SIZE=512
      - COUCHBASE_INDEX_RAM_SIZE=512
      - COUCHBASE_FTS_RAM_SIZE=1024
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -s -f -u "$$COUCHBASE_ADMINISTRATOR_USERNAME:$$COUCHBASE_ADMINISTRATOR_PASSWORD" http://localhost:8091/pools/default/buckets | grep -q '\[{' || exit 1
      timeout: 10s
    hostname: couchbase-server
    networks:
      default: null
    profiles:
      - couchbase
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - bind:
          create_host_path: true
        source: ./volumes/couchbase/data
        target: /opt/couchbase/var/lib/couchbase/data
        type: bind
    working_dir: /opt/couchbase
  db_mysql:
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh mysqld "--max_connections=$$MYSQL_MAX_CONNECTIONS" "--innodb_buffer_pool_size=$$MYSQL_INNODB_BUFFER_POOL_SIZE" "--innodb_log_file_size=$$MYSQL_INNODB_LOG_FILE_SIZE" "--innodb_flush_log_at_trx_commit=$$MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT"
    env_file:
      - path: ./envs/databases/db-postgres.env
        required: false
      - path: ./envs/databases/db-mysql.env
        required: false
      - path: ./envs/databases/db-mysql.defaults
        required: true
    healthcheck:
      interval: 1s
      retries: 30
      test:
        - CMD-SHELL
        - mysqladmin ping -u root -p"$$MYSQL_ROOT_PASSWORD"
      timeout: 3s
    image: mysql:8.0
    networks:
      default: null
    profiles:
      - mysql
    restart: always
    volumes:
      - source: ${MYSQL_HOST_VOLUME
        target: -./volumes/mysql/data}
        type: volume
        volume: {}
  db_postgres:
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh postgres -c "max_connections=$$POSTGRES_MAX_CONNECTIONS" -c "shared_buffers=$$POSTGRES_SHARED_BUFFERS" -c "work_mem=$$POSTGRES_WORK_MEM" -c "maintenance_work_mem=$$POSTGRES_MAINTENANCE_WORK_MEM" -c "effective_cache_size=$$POSTGRES_EFFECTIVE_CACHE_SIZE" -c "statement_timeout=$$POSTGRES_STATEMENT_TIMEOUT" -c "idle_in_transaction_session_timeout=$$POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT"
    env_file:
      - path: ./envs/databases/db-postgres.env
        required: false
      - path: ./envs/databases/db-postgres.defaults
        required: true
    healthcheck:
      interval: 1s
      retries: 60
      test:
        - CMD-SHELL
        - pg_isready -h db_postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      timeout: 3s
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/postgres:15-alpine
    networks:
      default: null
    profiles:
      - postgresql
    restart: always
    volumes:
      - source: db
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  elasticsearch:
    container_name: elasticsearch
    deploy:
      resources:
        limits:
          memory: 2g
    entrypoint:
      - sh
      - -c
      - sh /docker-entrypoint-mount.sh
    env_file:
      - path: ./envs/vectorstores/elasticsearch.env
        required: false
      - path: ./envs/vectorstores/elasticsearch.defaults
        required: true
    environment:
      VECTOR_STORE: ${VECTOR_STORE:-}
      cluster.name: dify-es-cluster
      discovery.type: single-node
      node.name: dify-es0
      xpack.license.self_generated.type: basic
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
    healthcheck:
      interval: 30s
      retries: 50
      test:
        - CMD
        - curl
        - -s
        - http://localhost:9200/_cluster/health?pretty
      timeout: 10s
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    networks:
      default: null
    ports:
      - ${ELASTICSEARCH_PORT:-9200}:9200
    profiles:
      - elasticsearch
      - elasticsearch-ja
    restart: always
    volumes:
      - bind:
          create_host_path: true
        source: ./elasticsearch/docker-entrypoint.sh
        target: /docker-entrypoint-mount.sh
        type: bind
      - source: dify_es01_data
        target: /usr/share/elasticsearch/data
        type: volume
        volume: {}
  etcd:
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    container_name: milvus-etcd
    env_file:
      - path: ./envs/vectorstores/milvus.env
        required: false
      - path: ./envs/infrastructure/etcd.env
        required: false
      - path: ./envs/infrastructure/etcd.defaults
        required: true
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD
        - etcdctl
        - endpoint
        - health
      timeout: 20s
    image: quay.io/coreos/etcd:v3.5.5
    networks:
      milvus: null
    profiles:
      - milvus
    volumes:
      - bind:
          create_host_path: true
        source: ./volumes/milvus/etcd
        target: /etcd
        type: bind
  init_permissions:
    command:
      - sh
      - -c
      - |
        for DIR in /app/api/storage /app/plugin_daemon/storage; do
          FLAG_FILE="$${DIR}/.init_permissions"
          if [ -f "$${FLAG_FILE}" ]; then
            echo "Permissions already initialized for $${DIR}."
            continue
          fi
          echo "Initializing permissions for $${DIR}"
          chown -R 1001:1001 "$${DIR}" && touch "$${FLAG_FILE}" || exit 1
        done
        echo "Permissions initialized. Exiting."
    image: busybox:latest
    networks:
      default: null
    restart: "no"
    volumes:
      - source: app
        target: /app/api/storage
        type: volume
        volume: {}
      - source: plugin_daemon
        target: /app/plugin_daemon/storage
        type: volume
        volume: {}
  iris:
    container_name: iris
    entrypoint:
      - /custom-entrypoint.sh
    env_file:
      - path: ./envs/vectorstores/iris.env
        required: false
      - path: ./envs/vectorstores/iris.defaults
        required: true
    environment:
      ISC_DATA_DIRECTORY: /durable/iris
    image: containers.intersystems.com/intersystems/iris-community:2025.3
    init: true
    networks:
      default: null
    ports:
      - ${IRIS_SUPER_SERVER_PORT:-1972}:1972
      - ${IRIS_WEB_SERVER_PORT:-52773}:52773
    profiles:
      - iris
    restart: always
    tty: true
    volumes:
      - bind:
          create_host_path: true
        source: ./volumes/iris
        target: /durable
        type: bind
      - bind:
          create_host_path: true
        source: ./iris/iris-init.script
        target: /iris-init.script
        type: bind
      - bind:
          create_host_path: true
        source: ./iris/docker-entrypoint.sh
        target: /custom-entrypoint.sh
        type: bind
  kibana:
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_started
        required: true
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: zh-CN
      NO_PROXY: localhost,127.0.0.1,elasticsearch,kibana
      SERVER_PORT: "5601"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: d1a66dfd-c4d3-4a0a-8290-2abcb83ab3aa
      XPACK_FLEET_ISAIRGAPPED: "true"
      XPACK_SECURITY_ENABLED: "true"
      XPACK_SECURITY_ENROLLMENT_ENABLED: "false"
      XPACK_SECURITY_HTTP_SSL_ENABLED: "false"
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD-SHELL
        - curl -s http://localhost:5601 >/dev/null || exit 1
      timeout: 10s
    image: docker.elastic.co/kibana/kibana:8.14.3
    networks:
      default: null
    ports:
      - ${KIBANA_PORT:-5601}:5601
    profiles:
      - elasticsearch
    restart: always
  knowledge_fs:
    depends_on:
      api:
        condition: service_healthy
        required: true
    environment:
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_ROOT_KNOWLEDGE_BACKGROUND_EXECUTION_OVERRIDE: ${KNOWLEDGE_BACKGROUND_EXECUTION-}
      DIFY_ROOT_KNOWLEDGE_DOCUMENT_MATERIALIZATION_MAX_CONCURRENCY_OVERRIDE: ${KNOWLEDGE_DOCUMENT_MATERIALIZATION_MAX_CONCURRENCY-}
      DIFY_ROOT_KNOWLEDGE_PDF_RASTERIZER_DPI_OVERRIDE: ${KNOWLEDGE_PDF_RASTERIZER_DPI-}
      DIFY_ROOT_KNOWLEDGE_PDF_RASTERIZER_MAX_ASSETS_OVERRIDE: ${KNOWLEDGE_PDF_RASTERIZER_MAX_ASSETS-}
      DIFY_ROOT_KNOWLEDGE_PDF_RASTERIZER_MAX_CONCURRENCY_OVERRIDE: ${KNOWLEDGE_PDF_RASTERIZER_MAX_CONCURRENCY-}
      DIFY_ROOT_KNOWLEDGE_PDF_RASTERIZER_OVERRIDE: ${KNOWLEDGE_PDF_RASTERIZER-}
      DIFY_ROOT_KNOWLEDGE_PDF_RASTERIZER_THUMBNAIL_DPI_OVERRIDE: ${KNOWLEDGE_PDF_RASTERIZER_THUMBNAIL_DPI-}
      DIFY_ROOT_KNOWLEDGE_PDF_RASTERIZER_TIMEOUT_MS_OVERRIDE: ${KNOWLEDGE_PDF_RASTERIZER_TIMEOUT_MS-}
      KNOWLEDGE_DIRECT_UPLOAD_ENABLED: ${KNOWLEDGE_DIRECT_UPLOAD_ENABLED:-true}
      KNOWLEDGE_INTEGRATED_MODE_ENABLED: ${KNOWLEDGE_INTEGRATED_MODE_ENABLED:-true}
      NODE_ENV: production
      PORT: 8787
    expose:
      - "8787"
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 30s
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      timeout: 5s
    image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/langgenius/dify-knowledge-fs-api:deploy-konwledge
    networks:
      default: null
    profiles:
      - knowledge-fs
    restart: always
  knowledge_fs_dispatch_worker:
    depends_on:
      api:
        condition: service_healthy
        required: true
    environment:
      CELERY_PREFETCH_MULTIPLIER: "1"
      CELERY_WORKER_CONCURRENCY: ${KNOWLEDGE_FS_DISPATCH_WORKER_CONCURRENCY:-1}
      CELERY_WORKER_POOL: prefork
      CELERY_WORKER_QUEUES: knowledge_fs_dispatch
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      KNOWLEDGE_DIRECT_UPLOAD_ENABLED: ${KNOWLEDGE_DIRECT_UPLOAD_ENABLED:-true}
      KNOWLEDGE_INTEGRATED_MODE_ENABLED: ${KNOWLEDGE_INTEGRATED_MODE_ENABLED:-true}
      MAX_TASKS_PER_CHILD: ${KNOWLEDGE_FS_WORKER_MAX_TASKS_PER_CHILD:-1000}
      MIGRATION_ENABLED: "false"
      MODE: worker
    image: ${KNOWLEDGE_FS_WORKER_IMAGE:-langgenius/dify-api:1.19.0}
    networks:
      default: null
    profiles:
      - knowledge-fs-celery
    restart: always
    stop_grace_period: 125m
  knowledge_fs_document_worker:
    depends_on:
      api:
        condition: service_healthy
        required: true
    environment:
      CELERY_PREFETCH_MULTIPLIER: "1"
      CELERY_WORKER_CONCURRENCY: ${KNOWLEDGE_FS_DOCUMENT_WORKER_CONCURRENCY:-2}
      CELERY_WORKER_POOL: prefork
      CELERY_WORKER_QUEUES: knowledge_fs_document,knowledge_fs_priority_document
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      KNOWLEDGE_DIRECT_UPLOAD_ENABLED: ${KNOWLEDGE_DIRECT_UPLOAD_ENABLED:-true}
      KNOWLEDGE_INTEGRATED_MODE_ENABLED: ${KNOWLEDGE_INTEGRATED_MODE_ENABLED:-true}
      MAX_TASKS_PER_CHILD: ${KNOWLEDGE_FS_WORKER_MAX_TASKS_PER_CHILD:-1000}
      MIGRATION_ENABLED: "false"
      MODE: worker
    image: ${KNOWLEDGE_FS_WORKER_IMAGE:-langgenius/dify-api:1.19.0}
    networks:
      default: null
    profiles:
      - knowledge-fs-celery
    restart: always
    stop_grace_period: 125m
  knowledge_fs_maintenance_worker:
    depends_on:
      api:
        condition: service_healthy
        required: true
    environment:
      CELERY_PREFETCH_MULTIPLIER: "1"
      CELERY_WORKER_CONCURRENCY: ${KNOWLEDGE_FS_MAINTENANCE_WORKER_CONCURRENCY:-1}
      CELERY_WORKER_POOL: prefork
      CELERY_WORKER_QUEUES: knowledge_fs_maintenance
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      KNOWLEDGE_DIRECT_UPLOAD_ENABLED: ${KNOWLEDGE_DIRECT_UPLOAD_ENABLED:-true}
      KNOWLEDGE_INTEGRATED_MODE_ENABLED: ${KNOWLEDGE_INTEGRATED_MODE_ENABLED:-true}
      MAX_TASKS_PER_CHILD: ${KNOWLEDGE_FS_WORKER_MAX_TASKS_PER_CHILD:-1000}
      MIGRATION_ENABLED: "false"
      MODE: worker
    image: ${KNOWLEDGE_FS_WORKER_IMAGE:-langgenius/dify-api:1.19.0}
    networks:
      default: null
    profiles:
      - knowledge-fs-celery
    restart: always
    stop_grace_period: 125m
  knowledge_fs_research_worker:
    depends_on:
      api:
        condition: service_healthy
        required: true
    environment:
      CELERY_PREFETCH_MULTIPLIER: "1"
      CELERY_WORKER_CONCURRENCY: ${KNOWLEDGE_FS_RESEARCH_WORKER_CONCURRENCY:-2}
      CELERY_WORKER_POOL: prefork
      CELERY_WORKER_QUEUES: knowledge_fs_research
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      KNOWLEDGE_DIRECT_UPLOAD_ENABLED: ${KNOWLEDGE_DIRECT_UPLOAD_ENABLED:-true}
      KNOWLEDGE_INTEGRATED_MODE_ENABLED: ${KNOWLEDGE_INTEGRATED_MODE_ENABLED:-true}
