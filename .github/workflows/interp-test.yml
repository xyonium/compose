name: Interp test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          cat > /tmp/c.yaml <<'YAML'
          services:
            a:
              image: ${JCR_REGISTRY:-docker.io}${JCR_REGISTRY:+/docker}/p3terx/aria2-pro
            b:
              image: ${JCR_REGISTRY:-ghcr.io}${JCR_REGISTRY:+/ghcr}/xyonium/firecrawl-pdf-ocr
          YAML
          echo "=== unset ==="
          env -u JCR_REGISTRY docker compose -f /tmp/c.yaml config | grep 'image:'
          echo "=== set ==="
          JCR_REGISTRY=mirror.example.com docker compose -f /tmp/c.yaml config | grep 'image:'
          echo "=== empty string ==="
          JCR_REGISTRY= docker compose -f /tmp/c.yaml config | grep 'image:'
