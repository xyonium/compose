name: Sync n8n compose

# 让 `n8n` orphan 分支与上游 n8n-io/n8n-hosting 保持同步（分支 2026-10-23 迁移入
# 本仓库：域名/registry 主机名一律 env 模板化，仓库任何文件不得含真实域名/主机名）：
#   1. docker-compose.upstream.yaml  <- 上游 docker-compose/withPostgresAndWorker/docker-compose.yml 原样拷贝（bot 维护）
#   2. .env.example                  <- 上游同目录 .env 原样拷贝（bot 维护）
#   3. init-data.sh                  <- 上游同目录 init-data.sh 原样拷贝（bot 维护）
#   4. docker-compose.yaml           <- 与 docker-compose.portainer.yaml 的预合并产物，
#                                       n8nio/n8n 与 n8nio/runners 钉 digest（--no-interpolate
#                                       保留 ${...} 模板，bot 生成，部署平台项目 env 注入：
#                                       N8N_DOMAIN / JCR_REGISTRY + 凭据变量）
# 全部自定义只放 docker-compose.portainer.yaml——另四个文件永远不要手改。
# 定时任务只跑默认分支，所以本文件放 main，checkout/推送的目标是 n8n 分支。

on:
  # ⚠️ 定时刻意未启用：启用方法——取消下面两行注释。
  # （与 sync-firecrawl / sync-authentik / sync-netbird / sync-sub2api 各错开 15 分钟，避免并发推不同分支互相踩脚）
  # schedule:
  #   - cron: "12 4 5 * *" # 每月 5 日 04:12 UTC（北京 12:12）
  workflow_dispatch:
    inputs:
      pin_mode:
        description: 'digest 策略：latest=解析上游当前最新（升级通道）；keep=保留合并产物里既有 digest（只验证合并不升级）'
        required: true
        default: 'latest'
        type: choice
        options: ['latest', 'keep']

permissions:
  contents: write

concurrency:
  group: n8n-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PIN_MODE: ${{ inputs.pin_mode || 'latest' }}
    steps:
      - name: Check out n8n branch
        uses: actions/checkout@v4
        with:
          ref: n8n

      - name: Fetch latest upstream compose, env reference and init script
        run: |
          base=https://raw.githubusercontent.com/n8n-io/n8n-hosting/main/docker-compose/withPostgresAndWorker
          curl -fsSL "$base/docker-compose.yml" -o docker-compose.upstream.yaml
          # .env 与 init-data.sh 也随同步原样更新，分支内即可查全部变量，不用翻上游
          curl -fsSL "$base/.env" -o .env.example
          curl -fsSL "$base/init-data.sh" -o init-data.sh

      - name: Merge, pin image digests and validate
        run: |
          set -euo pipefail
          # --no-interpolate 保留 ${VAR} 模板，由部署平台的项目 env 注入
          docker compose -f docker-compose.upstream.yaml -f docker-compose.portainer.yaml \
            config --no-interpolate --quiet
          docker compose -f docker-compose.upstream.yaml -f docker-compose.portainer.yaml \
            config --no-interpolate > docker-compose.merged.tmp.yaml

          # 钉两个主程序镜像：n8nio/n8n（n8n + n8n-worker 两处）与
          # n8nio/runners（n8n-runner + n8n-worker-runner 两处）。
          # pin_mode=latest 解析 docker hub 当前最新 digest；keep 保留旧生成品里既有 digest。
          # postgres:16-alpine（冻结，见 portainer 文件注释）/ redis:7-alpine
          # 是带版本号的稳定第三方镜像，刻意浮动不钉。
          # 镜像更新靠 compose diff 驱动：新 digest -> 文件变化 -> 平台重建拉新镜像，
          # digest 历史留在 git 里可回滚。
          #（合并产物里镜像行是字面 ${JCR_REGISTRY}/...，
          #  用 python 做纯字面替换，避免 shell/sed 对 ${} 双重转义——
          #  netbird/authentik/firecrawl/sub2api 同款写法）
          python3 - <<'PYEOF'
          import re, subprocess, sys, os

          pins = [
              ('${JCR_REGISTRY}/docker/n8nio/n8n', 'n8nio/n8n:latest', 2),
              ('${JCR_REGISTRY}/docker/n8nio/runners', 'n8nio/runners:latest', 2),
          ]
          pin_mode = os.environ.get('PIN_MODE', 'latest')
          assert pin_mode in ('latest', 'keep'), pin_mode

          t = open('docker-compose.merged.tmp.yaml').read()
          prev = open('docker-compose.yaml').read() if os.path.exists('docker-compose.yaml') else ''
          for lit, ref, expect in pins:
              pat = re.compile(re.escape(lit) + r'(:[A-Za-z0-9_.-]+)?(@sha256:[0-9a-f]{64})?(?=\s*$)', re.M)
              if pin_mode == 'keep':
                  # 「保留」指向旧生成品 docker-compose.yaml——portainer 手改层本来就不带
                  # digest（那是 bot 的活），本步刚 merge 出来的产物只剩 :latest。
                  prev_m = pat.search(prev)
                  if not prev_m or '@sha256:' not in prev_m.group(0):
                      print(f'::error::pin_mode=keep 但旧 docker-compose.yaml 里 {lit} 无 digest')
                      sys.exit(1)
                  digest = re.search(r'sha256:[0-9a-f]{64}', prev_m.group(0)).group(0)
              else:
                  r = subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', ref,
                                      '--format', '{{.Manifest.Digest}}'],
                                     capture_output=True, text=True)
                  digest = r.stdout.strip()
                  if not digest.startswith('sha256:'):
                      print(f'::error::empty digest for {ref}: {r.stdout!r} {r.stderr!r}')
                      sys.exit(1)
              t, n = pat.subn(f'{lit}@{digest}', t)
              if n != expect:
                  print(f'::error::pin failed for {lit}: matched {n} (expect {expect})')
                  sys.exit(1)
              print(f'pin_mode={pin_mode}: pinned {lit}@{digest} ({n} 处)')
          open('docker-compose.merged.tmp.yaml', 'w').write(t)
          n = t.count('@sha256:')
          if n != 4:
              print(f'::error::expected 4 pinned image refs in merged config, got {n}')
              sys.exit(1)
          PYEOF

          # 反向断言优先于正向哨兵：清洗后的产物不得含 certresolver / 宿主端口映射
          #（正向哨兵可能被注释行骗过——netbird 教训）
          for bad in \
            "certresolver" \
            "myresolver" \
            "tls.domains" \
            "published" ; do
            grep -qF "$bad" docker-compose.merged.tmp.yaml && {
              echo "::error::merged config unexpectedly contains '$bad'"
              exit 1
            }
          done

          # 哨兵检查：上游若改了我们 override 依赖的东西，大声失败而不是部署坏配置。
          #（只用短 token——生成文件会折叠长行；含 ${} 的 needle 必须单引号，
          #  否则 set -u 下被 shell 展开成 unbound variable；grep -qF 纯字面）
          for needle in \
            "name: n8n" \
            'Host(`${N8N_DOMAIN}`)' \
            '${JCR_REGISTRY}/docker/n8nio/n8n' \
            '${JCR_REGISTRY}/docker/n8nio/runners' \
            '${JCR_REGISTRY}/docker/postgres' \
            '${JCR_REGISTRY}/docker/redis' \
            "PGDATA" \
            "db_storage" \
            "n8n_storage" \
            "redis_storage" \
            "init-data.sh" \
            "reverse-proxy" \
            "traefik.enable" \
            "tls=true" \
            "http2https" \
            "EXECUTIONS_MODE" \
            "N8N_ENCRYPTION_KEY" \
            "RUNNERS_AUTH_TOKEN" \
            "5678"; do
            grep -qF "$needle" docker-compose.merged.tmp.yaml || {
              echo "::error::merged config missing '$needle' — upstream changed something our override relies on"
              exit 1
            }
          done
          mv docker-compose.merged.tmp.yaml docker-compose.yaml

          # 结构 smoke test：YAML 可解析 + 6 服务 + 4 钉版引用 + env 模板保留。
          #（最终校验不依赖 `docker compose config` 之外的环境假设——
          #  对齐 netbird/authentik/firecrawl/sub2api 范式：python 断言足够）
          python3 - <<'PYEOF'
          import yaml, sys
          d = yaml.safe_load(open('docker-compose.yaml'))
          assert set(d.get('services', {})) == {'postgres', 'redis', 'n8n', 'n8n-worker',
                                                'n8n-runner', 'n8n-worker-runner'}, \
              f"services mismatch: {list(d.get('services', {}))}"
          assert not d['services']['n8n'].get('ports'), \
              "n8n ports !reset drift — host port mapping is back"
          t = open('docker-compose.yaml').read()
          missing = [v for v in ('${JCR_REGISTRY}', '${N8N_DOMAIN}',
                                 'POSTGRES_PASSWORD', '${ENCRYPTION_KEY}',
                                 '${RUNNERS_AUTH_TOKEN}') if v not in t]
          assert not missing, f"missing env templates: {missing}"
          assert t.count('@sha256:') == 4, f"expected 4 pinned image refs, got {t.count('@sha256:')}"
          print('merged structure OK: yaml parses, 6 services, env templates intact, 4 pinned refs')
          PYEOF

      - name: Secret/sensitive leakage gate
        run: |
          set -euo pipefail
          # 总闸：任何真实域名/标识串都不应出现在仓库任何文件里
          #（占位域名 n8n.example.com / *.example.com 是允许的；
          #  pattern 隔位通配混淆——不含可直读串、不自匹配，各分支同款）
          ! git grep -niE 's[a-z]v[a-z]rc[a-z]re|h[a-z]nh[a-z]o[a-z]i' || {
            echo "::error::仓库文件残留真实域名——清洗机制被破坏"; exit 1; }
          echo "leakage gate OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.upstream.yaml .env.example init-data.sh docker-compose.yaml
          if git diff --cached --quiet; then
            echo "Upstream unchanged, nothing to do."
          else
            git commit -m "sync: upstream compose + image digests ($(date -u +%F), pin_mode=${PIN_MODE:-latest})"
            git push origin n8n
          fi
