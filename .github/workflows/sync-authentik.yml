name: Sync authentik compose

# 让 `authentik` orphan 分支与上游官方安装文件保持同步：
#   1. docker-compose.upstream.yaml  <- https://goauthentik.io/docker-compose.yml 原样拷贝（bot 维护）
#   2. docker-compose.yaml           <- 与 docker-compose.portainer.yaml 的预合并产物，
#                                       goauthentik/server 钉 digest（bot 生成，部署平台直接用它）
# 全部自定义只放 docker-compose.portainer.yaml——另两个文件永远不要手改。
# 定时任务只跑默认分支，所以本文件放 main，checkout/推送的目标是 authentik 分支。

on:
  # ⚠️ 定时刻意未启用：启用方法——取消下面两行注释。
  # （与 sync-firecrawl / sync-sub2api 各错开 15 分钟，避免并发推不同分支互相踩脚）
  # schedule:
  #   - cron: "12 4 5 * *" # 每月 5 日 04:12 UTC（北京 12:12）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authentik-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authentik branch
        uses: actions/checkout@v4
        with:
          ref: authentik

      - name: Fetch latest upstream compose
        run: |
          curl -fsSL https://goauthentik.io/docker-compose.yml \
            -o docker-compose.upstream.yaml

      - name: Merge, pin image digest and validate
        run: |
          set -euo pipefail
          # --no-interpolate 保留 ${VAR} 模板，由部署平台的项目 env 注入
          docker compose -f docker-compose.upstream.yaml -f docker-compose.portainer.yaml \
            config --no-interpolate --quiet
          docker compose -f docker-compose.upstream.yaml -f docker-compose.portainer.yaml \
            config --no-interpolate > docker-compose.merged.tmp.yaml

          # 只钉主程序镜像（server/worker 同一镜像）；postgres:16-alpine 是带版本号的
          # 稳定第三方镜像，刻意浮动不钉。tag 写死在 override 里（升级手改），
          # 这里从合并产物提取当前 tag，按 ghcr 原名解析 digest 后钉回 mirror 镜像。
          image="jcr.savorcare.com/ghcr/goauthentik/server"
          tag=$(grep -oE "${image}:[[:alnum:]_.-]+" docker-compose.merged.tmp.yaml | head -1 | cut -d: -f2)
          digest=$(docker buildx imagetools inspect "ghcr.io/goauthentik/server:${tag}" --format '{{.Manifest.Digest}}')
          sed -i -E "s#${image}(:[[:alnum:]_.-]+)?(@sha256:[[:xdigit:]]{64})?[[:space:]]*\$#${image}@${digest}#" \
            docker-compose.merged.tmp.yaml
          grep -q "${image}@${digest}" docker-compose.merged.tmp.yaml

          # 哨兵检查：上游若改了我们 override 依赖的东西，大声失败而不是部署坏配置。
          #（只用短 token——生成文件会折叠长行）
          for needle in \
            "auth.savorcare.com" \
            "traefik.enable" \
            "reverse-proxy" \
            "jcr.savorcare.com" \
            "goauthentik/server" \
            "AUTHENTIK_SECRET_KEY" \
            "docker.sock" \
            "name: authentik"; do
            grep -qE "$needle" docker-compose.merged.tmp.yaml || {
              echo "::error::merged config missing '$needle' — upstream changed something our override relies on"
              exit 1
            }
          done
          mv docker-compose.merged.tmp.yaml docker-compose.yaml
          # 最终文件必须能独立解析（上游对 PG_PASS / AUTHENTIK_SECRET_KEY 有 :? 断言，给哑值）
          PG_PASS=dummy AUTHENTIK_SECRET_KEY=dummy docker compose -f docker-compose.yaml config --quiet
          echo "merged file OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.upstream.yaml docker-compose.yaml
          if git diff --cached --quiet; then
            echo "Upstream unchanged, nothing to do."
          else
            git commit -m "sync: upstream compose + image digests ($(date -u +%F))"
            git push origin authentik
          fi
